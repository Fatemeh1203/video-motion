  <body>
    <template id="s4-portal-template">
      <style>

@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        #s4-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s4-wrap { position: absolute; inset: 0; }
        #s4-head { position: absolute; right: 110px; top: 200px; width: 760px; direction: rtl; }
        #s4-head > * { opacity: 0; }
        #s4-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); }
        #s4-title { margin-top: 8px; font-size: 92px; font-weight: 900; line-height: 1.2; }
        #s4-sub { margin-top: 14px; font-size: 36px; font-weight: 500; color: var(--ink2); line-height: 1.6; }
        .s4-pt { margin-top: 18px; display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; }
        .s4-pt i { width: 16px; height: 16px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 6px rgba(61, 111, 214, 0.18); flex-shrink: 0; }
        #s4-lock { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; padding: 10px 22px; border-radius: 16px; background: rgba(255, 255, 255, 0.8); font-size: 26px; font-weight: 600; color: var(--ink2); }

        /* the colleagues' page, rebuilt from index.html of the repo */
        #s4-phone { position: absolute; left: 190px; top: 70px; width: 600px; height: 920px; border-radius: 64px; padding: 18px;
          background: #1f335a; box-shadow: 0 60px 110px -40px rgba(31, 51, 90, 0.8); opacity: 0; }
        #s4-screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden;
          background: linear-gradient(180deg, #bcd8fb 0%, #d6e8fd 26%, #eaf3fe 52%, #f6faff 100%); direction: rtl; }
        #s4-page { position: absolute; left: 0; top: 0; width: 100%; padding: 40px 34px; }
        #s4-emb { width: 150px; height: 150px; margin: 10px auto 16px; border-radius: 50%; background: radial-gradient(70% 70% at 50% 35%, #fff, #f0f6ff);
          box-shadow: 0 30px 44px -22px rgba(80, 120, 195, 0.6); display: flex; align-items: center; justify-content: center; }
        #s4-emb img { width: 140px; height: 140px; }
        #s4-h1 { text-align: center; font-size: 40px; font-weight: 900; }
        #s4-tag { text-align: center; font-size: 22px; font-weight: 600; color: var(--ink2); margin-top: 4px; }
        #s4-badge { display: flex; justify-content: center; margin-top: 14px; }
        #s4-badge span { padding: 6px 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.8); font-size: 22px; font-weight: 800; }
        #s4-sec { margin: 30px 4px 14px; font-size: 28px; font-weight: 900; }
        .s4-card { position: relative; margin-bottom: 18px; padding: 22px 24px; border-radius: 26px; background: linear-gradient(180deg, #fff, #f4f8ff);
          box-shadow: 0 26px 44px -24px rgba(75, 115, 195, 0.6); border: 3px solid rgba(61, 111, 214, 0); display: flex; align-items: center; gap: 18px; }
        .s4-ci { width: 64px; height: 64px; border-radius: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .s4-card b { display: block; font-size: 29px; font-weight: 900; }
        .s4-card small { display: block; font-size: 22px; color: var(--ink3); font-weight: 600; line-height: 1.4; }
        #s4-tap { position: absolute; left: 0; top: 0; width: 70px; height: 70px; border-radius: 50%; border: 5px solid rgba(61, 111, 214, 0.9); opacity: 0; }
        #s4-finger { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: rgba(31, 51, 90, 0.35); border: 3px solid #fff; opacity: 0; }
      </style>

      <div id="s4-root" data-composition-id="s4-portal" data-width="1920" data-height="1080" data-duration="10.6">
        <div id="s4-wrap">
          <div id="s4-phone">
            <div id="s4-screen">
              <div id="s4-page">
                <div id="s4-emb"><img src="assets/farda-logo-ink.png" alt="" /></div>
                <div id="s4-h1">آموزشگاه علمی فردا</div>
                <div id="s4-tag">از امروز به فردا بیایید</div>
                <div id="s4-badge"><span>مدیر آموزشگاه · فاطمه شمس</span></div>
                <div id="s4-sec">ثبت روزانه</div>
                <div class="s4-card" id="s4-c1"><div class="s4-ci" style="background:linear-gradient(160deg,#79b0ff,#4d7fe6)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8"/></svg></div><div><b>ثبت واریزی</b><small>شهریه، مدرسه یا همکار</small></div></div>
                <div class="s4-card" id="s4-c2"><div class="s4-ci" style="background:linear-gradient(160deg,#8fb6c8,#5c86a8)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></div><div><b>ثبت هزینه</b><small>اجاره، قبوض، تبلیغات</small></div></div>
                <div class="s4-card" id="s4-c3"><div class="s4-ci" style="background:linear-gradient(160deg,#a58ff0,#6f57cf)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></div><div><b>کلاس‌ها و برنامهٔ هفتگی</b><small>برگزار یا لغو، برنامهٔ فراگیر</small></div></div>
              </div>
              <div id="s4-tap"></div>
              <div id="s4-finger"></div>
            </div>
          </div>

          <div id="s4-head">
            <div id="s4-eyebrow">۱ · صفحهٔ همکاران</div>
            <div id="s4-title">یک لینک، سه فرم</div>
            <div id="s4-sub">همکاران هر چه در آموزشگاه اتفاق می‌افتد را از گوشی ثبت می‌کنند.</div>
            <div class="s4-pt"><i></i>ثبت واریزی</div>
            <div class="s4-pt"><i style="background:#5c86a8"></i>ثبت هزینه</div>
            <div class="s4-pt"><i style="background:#6f57cf"></i>کلاس‌ها و برنامهٔ هفتگی</div>
            <div id="s4-lock">🔒 هر فرم با رمز همکاران باز می‌شود</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s4-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s4-phone", { opacity: 0, y: 140, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.9, ease: "power3.out" }, 0.2);
          tl.fromTo("#s4-emb", { scale: 0.6 }, { scale: 1, duration: 0.6, ease: "back.out(2)" }, 0.8);
          ["#s4-c1", "#s4-c2", "#s4-c3"].forEach(function (s, i) {
            tl.fromTo(s, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.6)" }, 2.8 + i * 0.4);
          });
          // gentle page scroll so the cards sit mid-screen
          tl.fromTo("#s4-page", { y: 0 }, { y: -40, duration: 3, ease: "sine.inOut" }, 4.5);

          const head = gsap.utils.toArray("#s4-head > *");
          head.forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.5 + i * (i < 3 ? 0.3 : 0.4));
          });

          // tap: "ثبت واریزی"
          tl.set("#s4-finger", { x: 380, y: 700 }, 7.0);
          tl.to("#s4-finger", { opacity: 1, duration: 0.25 }, 7.0);
          tl.to("#s4-finger", { x: 260, y: 468, duration: 0.9, ease: "power2.inOut" }, 7.2);
          tl.set("#s4-tap", { x: 247, y: 455, scale: 0.4 }, 8.5);
          tl.to("#s4-tap", { opacity: 1, scale: 1.6, duration: 0.45, ease: "power2.out" }, 8.5);
          tl.to("#s4-tap", { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.96);
          tl.to("#s4-c1", { scale: 0.96, duration: 0.12, ease: "power1.out" }, 8.5);
          tl.to("#s4-c1", { scale: 1, borderColor: "rgba(61,111,214,0.9)", duration: 0.3, ease: "power2.out" }, 8.62);

          tl.to("#s4-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 10.0);
          window.__timelines["s4-portal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
