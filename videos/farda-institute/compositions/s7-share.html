        #s7-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s7-wrap { position: absolute; inset: 0; }
        #s7-head { position: absolute; right: 110px; top: 90px; width: 840px; direction: rtl; }
        #s7-eyebrow, #s7-title, #s7-cap { opacity: 0; }
        #s7-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); }
        #s7-title { margin-top: 8px; font-size: 62px; white-space: nowrap; font-weight: 900; line-height: 1.25; }
        #s7-cap { margin-top: 26px; font-size: 28px; font-weight: 700; color: var(--ink2); }
        #s7-tiers { position: relative; margin-top: 14px; }
        .s7-t { position: relative; display: flex; align-items: center; gap: 20px; margin-bottom: 14px; padding: 16px 24px; border-radius: 20px; background: rgba(255, 255, 255, 0.85);
          border: 2px solid var(--card-line); font-size: 30px; font-weight: 700; opacity: 0; }
        .s7-t em { width: 50px; height: 50px; border-radius: 14px; background: var(--sky3); color: var(--blue-d); font-style: normal; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .s7-t small { color: var(--ink3); font-size: 24px; font-weight: 600; margin-right: auto; }
        #s7-pick { margin-top: 10px; display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 18px; background: var(--green-bg); color: var(--green); font-size: 32px; font-weight: 900; opacity: 0; }

        #s7-panel { position: absolute; left: 110px; top: 190px; width: 840px; height: 700px; border-radius: 34px; background: var(--card); border: 2px solid var(--card-line);
          box-shadow: var(--shadow); padding: 44px 50px; direction: rtl; opacity: 0; }
        #s7-lbl { font-size: 28px; font-weight: 700; color: var(--ink3); }
        #s7-total { margin-top: 10px; font-size: 88px; font-weight: 900; line-height: 1.35; }
        #s7-total small { font-size: 38px; color: var(--ink2); margin-right: 10px; }
        #s7-bar { position: relative; margin-top: 30px; height: 96px; border-radius: 24px; overflow: hidden; background: #e6eefb; display: flex; direction: rtl; }
        #s7-seg1 { width: 70%; height: 100%; background: linear-gradient(160deg, #6b9bf2, #2a54ad); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 900; }
        #s7-seg2 { width: 30%; height: 100%; background: linear-gradient(160deg, #a58ff0, #6f57cf); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; font-weight: 900; }
        #s7-legend { margin-top: 30px; display: flex; gap: 30px; }
        .s7-lg { flex: 1; padding: 22px 26px; border-radius: 22px; background: #fff; border: 2px solid var(--card-line); opacity: 0; }
        .s7-lg small { display: block; font-size: 26px; font-weight: 700; color: var(--ink2); }
        .s7-lg b { display: block; margin-top: 4px; font-size: 52px; font-weight: 900; }
        #s7-lg1 b { color: var(--blue-d); }
        #s7-lg2 b { color: var(--violet); }
        #s7-lock { position: absolute; left: 44px; top: 40px; width: 88px; height: 88px; border-radius: 24px; background: var(--ink); display: flex; align-items: center; justify-content: center; opacity: 0; }
        #s7-shackle { transform-origin: 16px 11px; }
        #s7-foot { margin-top: 26px; font-size: 26px; font-weight: 600; line-height: 1.6; color: var(--ink2); opacity: 0; }
      </style>

      <div id="s7-root" data-composition-id="s7-share" data-width="1920" data-height="1080" data-duration="10.6">
        <div id="s7-wrap">
          <div id="s7-panel">
            <div id="s7-lock"><svg width="48" height="48" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path id="s7-shackle" d="M10 14V10a6 6 0 0 1 12 0v4"/><rect x="6" y="14" width="20" height="14" rx="3" fill="#fff" stroke="none"/></svg></div>
            <div id="s7-lbl">واریزی سارا محمدی · دورهٔ C001</div>
            <div id="s7-total">۸۰۰٬۰۰۰<small>تومان</small></div>
            <div id="s7-bar"><div id="s7-seg1"><span id="s7-p1">۷۰٪</span></div><div id="s7-seg2"><span id="s7-p2">۳۰٪</span></div></div>
            <div id="s7-legend">
              <div class="s7-lg" id="s7-lg1"><small>سهم مدرس (M001)</small><b id="s7-n1">۰</b></div>
              <div class="s7-lg" id="s7-lg2"><small>سهم آموزشگاه</small><b id="s7-n2">۰</b></div>
            </div>
            <div id="s7-foot">درصد روی همان ردیف قفل می‌شود؛ اگر بعداً درصد مدرس عوض شود، واریزی‌های گذشته دست نمی‌خورند.</div>
          </div>

          <div id="s7-head">
            <div id="s7-eyebrow">۴ · سهم مدرس</div>
            <div id="s7-title">درصد، در لحظهٔ ثبت قفل می‌شود</div>
            <div id="s7-cap">پیشنهاد درصد از اولین لایه‌ای که پر باشد:</div>
            <div id="s7-tiers">
              <div class="s7-t"><em>۱</em>درصد ویژهٔ یک فراگیر<small>برگهٔ درصد_ویژه</small></div>
              <div class="s7-t"><em>۲</em>درصد اختصاصی کلاس<small>شیت کلاس‌ها</small></div>
              <div class="s7-t"><em>۳</em>درصد حضوری/آنلاین مدرس<small>شیت مدرسین</small></div>
              <div class="s7-t"><em>۴</em>درصد پیش‌فرض<small>شیت تنظیمات</small></div>
            </div>
            <div id="s7-pick">✓ ۷۰٪ · تأیید مدیر</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          const fa = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "٬").replace(/[0-9]/g, function (d) { return FA[+d]; }); };
          tl.fromTo("#s7-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s7-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
          tl.fromTo("#s7-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4);
          tl.fromTo("#s7-cap", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.1);
          const tiers = gsap.utils.toArray("#s7-root .s7-t");
          tiers.forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.3 + i * 0.12);
            // scan down the cascade
            tl.to(el, { borderColor: "rgba(61,111,214,0.85)", scale: 1.02, duration: 0.2, ease: "power2.out" }, 1.8 + i * 0.6);
            tl.to(el, { borderColor: "rgba(61,111,214,0.18)", scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.25 + i * 0.6);
          });
          tl.fromTo("#s7-pick", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 4.4);

          tl.fromTo("#s7-panel", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
          tl.fromTo("#s7-seg1", { width: "100%" }, { width: "70%", duration: 0.9, ease: "power3.inOut" }, 4.4);
          tl.fromTo("#s7-seg2", { width: "0%" }, { width: "30%", duration: 0.9, ease: "power3.inOut" }, 4.4);
          tl.fromTo(["#s7-p1", "#s7-p2"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 5.0);
          tl.fromTo(["#s7-lg1", "#s7-lg2"], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.15 }, 5.0);
          const n1 = document.querySelector("#s7-n1"), n2 = document.querySelector("#s7-n2");
          const c = { a: 0, b: 0 };
          tl.fromTo(c, { a: 0, b: 0 }, { a: 560000, b: 240000, duration: 1.3, ease: "power2.out",
            onUpdate: function () { n1.textContent = fa(Math.round(c.a / 1000) * 1000); n2.textContent = fa(Math.round(c.b / 1000) * 1000); } }, 5.1);
          tl.fromTo("#s7-lock", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 5.0);
          tl.fromTo("#s7-shackle", { y: -5 }, { y: 0, duration: 0.2, ease: "power4.in" }, 5.5);
          tl.fromTo("#s7-foot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.8);

          tl.to("#s7-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 10.0);
          window.__timelines["s7-share"] = tl;
        })();
      </script>
    </template>
