<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s5-form-template">
      <style>

@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        #s5-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s5-wrap { position: absolute; inset: 0; }
        #s5-head { position: absolute; right: 110px; top: 150px; width: 650px; direction: rtl; }
        #s5-head > * { opacity: 0; }
        #s5-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); }
        #s5-title { margin-top: 8px; font-size: 78px; font-weight: 900; line-height: 1.2; }
        #s5-amt { margin-top: 18px; font-size: 104px; font-weight: 900; color: var(--blue-d); line-height: 1.1; }
        #s5-amt small { font-size: 44px; font-weight: 800; color: var(--ink2); margin-right: 12px; }
        .s5-note { margin-top: 22px; padding: 18px 24px; border-radius: 20px; background: rgba(255, 255, 255, 0.82); border: 2px solid var(--card-line); font-size: 28px; font-weight: 600; line-height: 1.6; color: var(--ink2); }
        .s5-note b { color: var(--ink); font-weight: 900; }

        #s5-form { position: absolute; left: 110px; top: 90px; width: 1000px; height: 870px; border-radius: 34px; background: var(--card);
          border: 2px solid var(--card-line); box-shadow: var(--shadow); padding: 36px 44px; direction: rtl; opacity: 0; }
        #s5-ftop { display: flex; align-items: center; gap: 18px; padding-bottom: 20px; border-bottom: 2px solid rgba(61, 111, 214, 0.14); }
        #s5-ftop .ic { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(160deg, #79b0ff, #4d7fe6); display: flex; align-items: center; justify-content: center; }
        #s5-ftop b { font-size: 40px; font-weight: 900; }
        #s5-ftop small { display: block; font-size: 23px; color: var(--ink3); font-weight: 600; }
        #s5-grid { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
        .s5-f label { display: block; font-size: 24px; font-weight: 700; color: var(--ink2); margin-bottom: 8px; }
        .s5-f label em { font-style: normal; color: var(--red); margin-right: 4px; }
        .s5-in { position: relative; height: 70px; border-radius: 16px; background: #fff; border: 2px solid rgba(61, 111, 214, 0.22); padding: 0 20px; display: flex; align-items: center; font-size: 30px; font-weight: 700; }
        .s5-v { display: block; white-space: nowrap; }
        .s5-sel::after { content: "▾"; position: absolute; left: 20px; top: 16px; font-size: 26px; color: var(--ink3); }
        .s5-file { display: inline-flex; align-items: center; gap: 10px; padding: 4px 14px; border-radius: 12px; background: var(--sky3); color: var(--blue-d); font-size: 26px; font-weight: 800; }
        #s5-btn { margin-top: 30px; height: 84px; border-radius: 22px; background: linear-gradient(160deg, #4d7fe6, #2a54ad); color: #fff; font-size: 36px; font-weight: 900;
          display: flex; align-items: center; justify-content: center; box-shadow: 0 24px 40px -20px rgba(42, 84, 173, 0.9); }
        #s5-done { position: absolute; left: 280px; top: 405px; width: 660px; height: 240px; border-radius: 30px; background: #fff;
          box-shadow: 0 50px 100px -30px rgba(31, 51, 90, 0.6); border: 3px solid rgba(28, 122, 81, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; opacity: 0; }
        #s5-done b { font-size: 46px; font-weight: 900; color: var(--green); }
        #s5-done span { font-size: 28px; font-weight: 600; color: var(--ink2); }
        #s5-ck { width: 76px; height: 76px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; }
        #s5-finger { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; background: rgba(31, 51, 90, 0.35); border: 3px solid #fff; opacity: 0; }
      </style>

      <div id="s5-root" data-composition-id="s5-form" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s5-wrap">
          <div id="s5-form">
            <div id="s5-ftop">
              <div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8"/></svg></div>
              <div><b>ثبت واریزی</b><small>آموزشگاه علمی فردا · فرم همکاران</small></div>
            </div>
            <div id="s5-grid">
              <div class="s5-f"><label>پرداخت‌کننده چه کسی است؟<em>*</em></label><div class="s5-in s5-sel"><span class="s5-v">فراگیر</span></div></div>
              <div class="s5-f"><label>نام پرداخت‌کننده<em>*</em></label><div class="s5-in"><span class="s5-v">سارا محمدی</span></div></div>
              <div class="s5-f"><label>مبلغ (تومان)<em>*</em></label><div class="s5-in"><span class="s5-v">۸۰۰.۰۰۰</span></div></div>
              <div class="s5-f"><label>تاریخ پرداخت<em>*</em></label><div class="s5-in"><span class="s5-v">۱۴۰۵/۰۵/۱۸</span></div></div>
              <div class="s5-f"><label>دوره / درس<em>*</em></label><div class="s5-in"><span class="s5-v">C001</span></div></div>
              <div class="s5-f"><label>روش پرداخت<em>*</em></label><div class="s5-in s5-sel"><span class="s5-v">کارت به کارت</span></div></div>
              <div class="s5-f"><label>عکس یا PDF فیش</label><div class="s5-in"><span class="s5-v s5-file">📎 عکس فیش</span></div></div>
              <div class="s5-f"><label>ثبت‌کننده<em>*</em></label><div class="s5-in"><span class="s5-v">فاطمه</span></div></div>
            </div>
            <div id="s5-btn">ارسال</div>
            <div id="s5-finger"></div>
          </div>
          <div id="s5-done" data-layout-allow-overlap data-layout-allow-occlusion>
            <div id="s5-ck"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
            <b data-layout-allow-overlap>ارسال شد</b>
            <span data-layout-allow-overlap>در انتظار تأیید مدیر</span>
          </div>

          <div id="s5-head">
            <div id="s5-eyebrow">۲ · یک نمونهٔ واقعی</div>
            <div id="s5-title">شهریهٔ سارا محمدی</div>
            <div id="s5-amt"><span id="s5-num">۰</span><small>تومان</small></div>
            <div class="s5-note" id="s5-n1"><b>مدرس و درصد را همکار نمی‌نویسد؛</b> سیستم از روی دوره پیشنهاد می‌دهد.</div>
            <div class="s5-note" id="s5-n2">مبلغ با نقطه، ویرگول یا بدون جداکننده درست خوانده می‌شود.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          const fa = function (n) { return String(n).replace(/[0-9]/g, function (d) { return FA[+d]; }); };
          tl.fromTo("#s5-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s5-form", { opacity: 0, y: 100, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.1);

          const head = ["#s5-eyebrow", "#s5-title", "#s5-amt", "#s5-n1", "#s5-n2"];
          tl.fromTo(head[0], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.fromTo(head[1], { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.6);
          tl.fromTo(head[2], { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 3.2);
          const num = document.querySelector("#s5-num");
          const c = { v: 0 };
          tl.fromTo(c, { v: 0 }, { v: 800000, duration: 1.4, ease: "power2.out",
            onUpdate: function () { num.textContent = fa(String(Math.round(c.v / 1000) * 1000).replace(/\B(?=(\d{3})+(?!\d))/g, "٬")); } }, 3.3);
          tl.fromTo(head[3], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.6);
          tl.fromTo(head[4], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 7.4);

          // values fill in, revealed from the right (RTL), one field after another
          gsap.utils.toArray("#s5-root .s5-v").forEach(function (el, i) {
            const t = 1.6 + i * 0.95;
            tl.fromTo(el, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "none" }, t);
            tl.fromTo(el.parentNode, { borderColor: "rgba(61,111,214,0.22)" }, { borderColor: "rgba(61,111,214,0.85)", duration: 0.2, ease: "power1.out" }, t);
            tl.to(el.parentNode, { borderColor: "rgba(61,111,214,0.22)", duration: 0.3, ease: "power1.out" }, t + 0.8);
          });

          // press send
          tl.set("#s5-finger", { x: 620, y: 720 }, 9.2);
          tl.to("#s5-finger", { opacity: 1, duration: 0.2 }, 9.2);
          tl.to("#s5-finger", { x: 470, y: 790, duration: 0.7, ease: "power2.inOut" }, 9.3);
          tl.to("#s5-btn", { scale: 0.96, duration: 0.12, ease: "power1.out" }, 10.1);
          tl.to("#s5-btn", { scale: 1, duration: 0.25, ease: "power2.out" }, 10.22);
          tl.to("#s5-finger", { opacity: 0, duration: 0.2 }, 10.3);
          tl.to("#s5-form", { opacity: 0.35, scale: 0.97, duration: 0.4, ease: "power1.out" }, 10.4);
          tl.fromTo("#s5-done", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 10.5);

          tl.to("#s5-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 12.0);
          window.__timelines["s5-form"] = tl;
        })();
      </script>
    </template>
  </body>
