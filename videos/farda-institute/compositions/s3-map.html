    <template id="s3-map-template">
      <style>

@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        #s3-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s3-wrap { position: absolute; inset: 0; }
        #s3-head { position: absolute; right: 100px; top: 70px; width: 1500px; direction: rtl; }
        #s3-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); opacity: 0; }
        #s3-title { margin-top: 6px; font-size: 84px; font-weight: 900; line-height: 1.25; opacity: 0; }
        #s3-sub { margin-top: 4px; font-size: 36px; font-weight: 500; color: var(--ink2); opacity: 0; }
        #s3-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        .s3-node, .s3-in {
          position: absolute; direction: rtl; border-radius: 26px; background: var(--card); border: 2px solid var(--card-line);
          box-shadow: var(--shadow); opacity: 0;
        }
        .s3-node { width: 270px; height: 200px; top: 505px; padding: 22px 24px; }
        .s3-in { width: 330px; height: 118px; left: 1520px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; }
        .s3-ic { width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
          box-shadow: 0 14px 22px -12px rgba(70, 120, 220, 0.8); }
        .s3-node .s3-ic { margin-bottom: 12px; }
        .s3-node b, .s3-in b { display: block; font-size: 31px; white-space: nowrap; font-weight: 900; line-height: 1.25; }
        .s3-node small, .s3-in small { display: block; margin-top: 4px; font-size: 23px; font-weight: 600; color: var(--ink3); line-height: 1.4; }
        .s3-tag { position: absolute; left: 18px; top: 18px; font-size: 22px; font-weight: 800; color: var(--blue-d); direction: ltr; }
        #s3-strip { position: absolute; right: 100px; top: 905px; width: 1400px; display: flex; flex-wrap: wrap; gap: 12px; direction: rtl; }
        .s3-wf { padding: 8px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.8); border: 2px solid var(--card-line); font-size: 23px; font-weight: 700; color: var(--ink2); opacity: 0; }
        .s3-wf em { font-style: normal; color: var(--blue-d); font-weight: 900; margin-left: 8px; }
        #s3-coin { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a8, #e0a526 70%);
          box-shadow: 0 0 0 6px rgba(224, 165, 38, 0.25), 0 8px 18px rgba(160, 110, 10, 0.5); opacity: 0; }
      </style>

      <div id="s3-root" data-composition-id="s3-map" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s3-wrap">
          <div id="s3-head">
            <div id="s3-eyebrow">نقشهٔ کل سیستم</div>
            <div id="s3-title">۹ ورک‌فلو، یک چرخهٔ کامل</div>
            <div id="s3-sub">ورودی از سه در ← تأیید مدیر ← دفتر ← حقوق و گزارش خودکار</div>
          </div>

          <svg id="s3-svg" viewBox="0 0 1920 1080">
            <g fill="none" stroke="#3d6fd6" stroke-width="4" stroke-linecap="round">
              <path class="s3-ln" d="M1520 395 C1470 395 1480 605 1420 605" />
              <path class="s3-ln" d="M1520 605 L1420 605" />
              <path class="s3-ln" d="M1520 815 C1470 815 1480 605 1420 605" />
              <path class="s3-ln" d="M1150 605 L1060 605" />
              <path class="s3-ln" d="M790 605 L700 605" />
              <path class="s3-ln" d="M430 605 L340 605" />
            </g>
          </svg>

          <div id="s3-coin"></div>

          <div class="s3-in" style="top:336px"><div class="s3-ic" style="background:linear-gradient(160deg,#79b0ff,#4d7fe6)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8"/></svg></div><div><b>فرم واریزی</b><small>شهریه و پرداخت‌ها</small></div></div>
          <div class="s3-in" style="top:546px"><div class="s3-ic" style="background:linear-gradient(160deg,#8fb6c8,#5c86a8)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></div><div><b>فرم هزینه</b><small>با عکس فاکتور</small></div></div>
          <div class="s3-in" style="top:756px"><div class="s3-ic" style="background:linear-gradient(160deg,#6fcf97,#1e8e3e)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg></div><div><b>اکسل و وبهوک</b><small>ورود دسته‌ای</small></div></div>

          <div class="s3-node" style="left:1150px"><span class="s3-tag">WF-05</span><div class="s3-ic" style="background:linear-gradient(160deg,#5cc3f5,#2aabee)"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/></svg></div><b>تأیید تلگرام</b><small>ثبت کن / رد کن</small></div>
          <div class="s3-node" style="left:790px"><span class="s3-tag">17 sheets</span><div class="s3-ic" style="background:linear-gradient(160deg,#6fcf97,#1e8e3e)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg></div><b>دفتر گوگل‌شیت</b><small>فارسی و راست‌چین</small></div>
          <div class="s3-node" style="left:430px"><span class="s3-tag">WF-03</span><div class="s3-ic" style="background:linear-gradient(160deg,#a58ff0,#6f57cf)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div><b>بستن ماه</b><small>حقوق مدرس + ایمیل</small></div>
          <div class="s3-node" style="left:70px"><span class="s3-tag">WF-04</span><div class="s3-ic" style="background:linear-gradient(160deg,#ffcf7a,#d99614)"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V12M10 20V7M15 20v-5M20 20V4"/></svg></div><b>گزارش دوره‌ای</b><small>و ارزش تورمی سرمایه</small></div>

          <div id="s3-strip">
            <span class="s3-wf"><em>۰۱</em>کلاس‌ها و برنامهٔ هفتگی</span>
            <span class="s3-wf"><em>۰۲</em>ورود اکسل</span>
            <span class="s3-wf"><em>۰۳</em>بستن ماه و حقوق</span>
            <span class="s3-wf"><em>۰۴</em>گزارش ۳/۶/۱۲ ماهه</span>
            <span class="s3-wf"><em>۰۵</em>واریزی و هزینه</span>
            <span class="s3-wf"><em>۰۶</em>اتصال تلگرام</span>
            <span class="s3-wf"><em>۰۷</em>آوردهٔ سرمایه‌گذار</span>
            <span class="s3-wf"><em>۰۸</em>فهرست کلاس‌ها</span>
            <span class="s3-wf"><em>۰۰</em>راه‌اندازی دفتر</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s3-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);
          tl.fromTo("#s3-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.5);
          tl.fromTo("#s3-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);

          // inputs, then the flow line draws leftward node by node
          gsap.utils.toArray("#s3-root .s3-in").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.6)" }, 2.1 + i * 0.4);
          });
          const lines = gsap.utils.toArray("#s3-root .s3-ln");
          lines.forEach(function (p) {
            const L = p.getTotalLength();
            p.style.strokeDasharray = L + " " + L;
            p.style.strokeDashoffset = L;
          });
          [0, 1, 2].forEach(function (i) {
            tl.to(lines[i], { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 3.4 + i * 0.1);
          });
          const nodes = gsap.utils.toArray("#s3-root .s3-node");
          nodes.forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 3.8 + i * 0.9);
            if (i < 3) tl.to(lines[3 + i], { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 4.3 + i * 0.9);
          });

          // a payment travels the whole loop
          tl.set("#s3-coin", { x: 1500, y: 378 }, 7.4);
          tl.to("#s3-coin", { opacity: 1, duration: 0.2 }, 7.4);
          tl.to("#s3-coin", { x: 1440, y: 588, duration: 0.6, ease: "power1.inOut" }, 7.6);
          tl.to("#s3-coin", { x: 1268, duration: 0.6, ease: "power2.inOut" }, 8.2);
          tl.to("#s3-coin", { x: 908, duration: 0.7, ease: "power2.inOut" }, 8.9);
          tl.to("#s3-coin", { x: 548, duration: 0.7, ease: "power2.inOut" }, 9.7);
          tl.to("#s3-coin", { x: 188, duration: 0.7, ease: "power2.inOut" }, 10.5);
          tl.to("#s3-coin", { opacity: 0, scale: 2, duration: 0.4, ease: "power1.out" }, 11.2);
          nodes.forEach(function (el, i) {
            const t = [8.5, 9.3, 10.1, 10.9][i];
            tl.to(el, { borderColor: "rgba(61,111,214,0.75)", y: -10, duration: 0.25, ease: "power2.out" }, t);
            tl.to(el, { y: 0, duration: 0.4, ease: "power2.inOut" }, t + 0.25);
          });

          gsap.utils.toArray("#s3-root .s3-wf").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 7.6 + i * 0.12);
          });

          tl.to("#s3-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 12.0);
          window.__timelines["s3-map"] = tl;
        })();
      </script>
    </template>
  </body>
