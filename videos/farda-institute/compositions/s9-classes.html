        #s9-title { margin-top: 6px; font-size: 80px; font-weight: 900; line-height: 1.25; }
        #s9-win { position: absolute; left: 110px; top: 250px; width: 1700px; height: 530px; border-radius: 28px; background: var(--card); border: 2px solid var(--card-line);
          box-shadow: var(--shadow); padding: 26px 34px; direction: rtl; opacity: 0; }
        #s9-wt { font-size: 29px; font-weight: 900; margin-bottom: 14px; }
        #s9-wt small { font-size: 23px; font-weight: 600; color: var(--ink3); margin-right: 12px; }

        .s9-h { height: 58px; font-size: 23px; font-weight: 800; color: var(--ink3); background: #eef4fd; border-radius: 14px; border-bottom: 0; }

        .s9-p { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: #fff; border: 2px solid var(--card-line); font-size: 25px; font-weight: 700; }
        .s9-p i { font-style: normal; color: var(--red); font-weight: 900; }
        .s9-gold { display: inline-block; padding: 4px 14px; border-radius: 10px; background: var(--gold-bg); color: var(--gold); font-size: 23px; font-weight: 900; border: 2px solid rgba(168, 101, 13, 0.4); }

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s9-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s9-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
          tl.fromTo("#s9-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4);
          tl.fromTo("#s9-win", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.4);
          tl.fromTo("#s9-root .s9-h", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.9);
          tl.fromTo("#s9-r1", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.1);
          tl.fromTo("#s9-r2", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.4);

          // a second learner in the same slot joins group G-1
          tl.fromTo("#s9-new", { opacity: 0, y: -60, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 2.6);
          tl.fromTo("#s9-r1 .s9-g", { scale: 1 }, { scale: 1.3, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 2.9);
          tl.fromTo("#s9-f1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.0);

          // duplicate refused
          tl.fromTo("#s9-toast", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.0);
          tl.to("#s9-toast", { x: -10, duration: 0.06, ease: "none", yoyo: true, repeat: 5 }, 5.4);
          tl.fromTo("#s9-f2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 5.2);
          tl.to("#s9-toast", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.4);

          // make-up session with the gold tag
          tl.fromTo("#s9-r3", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 6.6);
          tl.fromTo("#s9-r3 .s9-gold", { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "back.out(3)", stagger: 0.15 }, 6.8);
          tl.fromTo("#s9-f3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.9);
          tl.fromTo("#s9-f4", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 7.6);

          tl.to("#s9-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 9.2);
          window.__timelines["s9-classes"] = tl;
        })();
      </script>
