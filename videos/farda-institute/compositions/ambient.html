        #amb-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; }
        .amb-cloud { position: absolute; border-radius: 120px; filter: blur(2px); }
        #amb-a { top: 60px; right: -80px; width: 460px; height: 170px; background: radial-gradient(60% 90% at 30% 60%, #fff 0%, #eaf2ff 60%, rgba(234,242,255,0) 72%); }

        #amb-bug { position: absolute; left: 56px; bottom: 34px; display: flex; align-items: center; gap: 14px; direction: rtl; opacity: 0; }
        #amb-bug img { width: 62px; height: 62px; }
        #amb-bug span { font-size: 24px; font-weight: 700; color: var(--ink2); }

      <div id="amb-root" data-composition-id="ambient" data-width="1920" data-height="1080" data-duration="120">
        <div class="amb-cloud" id="amb-a"></div>
        <div class="amb-cloud" id="amb-b"></div>
        <div class="amb-cloud" id="amb-c"></div>
        <div class="amb-cloud" id="amb-d"></div>
        <div id="amb-bug"><img src="assets/farda-logo-ink.png" alt="" /><span>آموزشگاه علمی فردا</span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#amb-a", { x: 0, y: 0 }, { x: -160, y: 20, duration: 120, ease: "sine.inOut" }, 0);
          tl.fromTo("#amb-b", { x: 0, y: 0 }, { x: 200, y: -30, duration: 120, ease: "sine.inOut" }, 0);
          tl.fromTo("#amb-c", { x: 0, y: 0 }, { x: -120, y: -40, duration: 120, ease: "sine.inOut" }, 0);
          tl.fromTo("#amb-d", { x: 0, y: 0 }, { x: 140, y: 10, duration: 120, ease: "sine.inOut" }, 0);
          tl.fromTo("#amb-bug", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 19.6);
          tl.to("#amb-bug", { opacity: 0, duration: 0.5, ease: "power1.in" }, 112.2);
          window.__timelines["ambient"] = tl;
        })();
      </script>
