<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s2-intro-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-200B, U+2012-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215; }

        #s2-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s2-wrap { position: absolute; inset: 0; }
        #s2-halo { position: absolute; right: 190px; top: 150px; width: 560px; height: 560px; border-radius: 50%;
          background: radial-gradient(70% 70% at 50% 35%, #ffffff 0%, #f0f6ff 100%);
          box-shadow: 0 60px 90px -30px rgba(80, 120, 195, 0.55), inset 0 -14px 30px rgba(150, 185, 240, 0.3), inset 0 14px 30px rgba(255, 255, 255, 0.95); }
        #s2-logo { position: absolute; right: 230px; top: 180px; width: 480px; height: 480px; }
        #s2-ring { position: absolute; right: 150px; top: 110px; width: 640px; height: 640px; border-radius: 50%; border: 3px dashed rgba(61, 111, 214, 0.35); }
        #s2-text { position: absolute; right: 900px; top: 250px; width: 900px; direction: rtl; }
        #s2-eyebrow { font-size: 32px; font-weight: 700; color: var(--blue-d); }
        #s2-title { margin-top: 10px; font-size: 104px; font-weight: 900; line-height: 1.2; }
        #s2-sub { margin-top: 14px; font-size: 46px; font-weight: 500; color: var(--ink2); }
        #s2-rule { margin-top: 34px; height: 4px; width: 620px; border-radius: 4px; background: linear-gradient(270deg, var(--blue), rgba(61, 111, 214, 0)); transform-origin: right center; }
        #s2-by { margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; padding: 12px 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); box-shadow: 0 16px 34px -16px rgba(90, 130, 200, 0.7); font-size: 30px; }
        #s2-by .r { color: var(--ink3); font-weight: 600; }
        #s2-by .n { color: var(--ink); font-weight: 900; }
        #s2-stack { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 16px; direction: ltr; justify-content: flex-end; }
        .s2-chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 18px; background: #fff; border: 2px solid var(--card-line); box-shadow: 0 16px 30px -18px rgba(60, 100, 180, 0.7); font-size: 30px; font-weight: 800; color: var(--ink); opacity: 0; }
        .s2-chip i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }
        #s2-eyebrow, #s2-title, #s2-sub, #s2-by { opacity: 0; }
      </style>

      <div id="s2-root" data-composition-id="s2-intro" data-width="1920" data-height="1080" data-duration="9.6">
        <div id="s2-wrap">
          <div id="s2-ring"></div>
          <div id="s2-halo"></div>
          <img id="s2-logo" src="assets/farda-logo-ink.png" alt="لوگوی آموزشگاه علمی فردا" />

          <div id="s2-text">
            <div id="s2-eyebrow">معرفی پروژه</div>
            <div id="s2-title">آموزشگاه علمی فردا</div>
            <div id="s2-sub">سیستم حسابداری و ثبت روزانه، کاملاً خودکار</div>
            <div id="s2-rule"></div>
            <div id="s2-by"><span class="r">طراحی و ساخت:</span><span class="n">فاطمه شمس</span></div>
            <div id="s2-stack">
              <span class="s2-chip"><i style="background:#ea4b71"></i>n8n</span>
              <span class="s2-chip"><i style="background:#1e8e3e"></i>Google Sheets</span>
              <span class="s2-chip"><i style="background:#2aabee"></i>Telegram</span>
              <span class="s2-chip"><i style="background:#d93025"></i>Gmail</span>
              <span class="s2-chip"><i style="background:#f4b400"></i>Google Drive</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s2-halo", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "back.out(1.4)" }, 0.2);
          tl.fromTo("#s2-logo", { opacity: 0, scale: 0.85, clipPath: "inset(0% 0% 100% 0%)" },
            { opacity: 1, scale: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 1.4, ease: "power2.out" }, 0.6);
          tl.fromTo("#s2-ring", { opacity: 0, rotation: -40 }, { opacity: 1, rotation: 20, duration: 9.6, ease: "none" }, 0.4);
          tl.to("#s2-halo", { y: -14, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.2);

          tl.fromTo("#s2-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.9);
          tl.fromTo("#s2-title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 1.1);
          tl.fromTo("#s2-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.6);
          tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 2.0);
          tl.fromTo("#s2-by", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 2.8);
          gsap.utils.toArray("#s2-root .s2-chip").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 4.2 + i * 0.3);
          });

          tl.to("#s2-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 9.0);
          window.__timelines["s2-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
