        #s6-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s6-wrap { position: absolute; inset: 0; }
        #s6-head { position: absolute; right: 110px; top: 170px; width: 800px; direction: rtl; }
        #s6-eyebrow, #s6-title, #s6-b1, #s6-b2, #s6-chip { opacity: 0; }
        #s6-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); }
        #s6-title { margin-top: 8px; font-size: 80px; font-weight: 900; line-height: 1.25; }
        #s6-title b { color: var(--blue-d); }
        .s6-pt { margin-top: 26px; display: flex; align-items: flex-start; gap: 16px; font-size: 34px; font-weight: 700; line-height: 1.5; }
        .s6-pt i { margin-top: 18px; width: 16px; height: 16px; border-radius: 50%; background: var(--tg); box-shadow: 0 0 0 6px rgba(42, 171, 238, 0.2); flex-shrink: 0; }
        #s6-chip { margin-top: 34px; display: inline-block; padding: 12px 24px; border-radius: 18px; background: rgba(255, 255, 255, 0.85); border: 2px solid var(--card-line); font-size: 27px; font-weight: 600; color: var(--ink2); }

        #s6-phone { position: absolute; left: 190px; top: 70px; width: 600px; height: 920px; border-radius: 64px; padding: 18px; background: #1f335a;
          box-shadow: 0 60px 110px -40px rgba(31, 51, 90, 0.8); opacity: 0; }
        #s6-screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: linear-gradient(180deg, #dbe7f5, #cfe0f2); direction: rtl; }
        #s6-bar { height: 116px; padding: 36px 26px 0; background: #fff; display: flex; align-items: center; gap: 16px; box-shadow: 0 6px 16px rgba(31, 51, 90, 0.08); }
        #s6-av { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(160deg, #5cc3f5, #2aabee); display: flex; align-items: center; justify-content: center; }
        #s6-bar b { display: block; font-size: 27px; font-weight: 900; }
        #s6-bar small { display: block; font-size: 22px; font-weight: 600; color: var(--ink3); }
        #s6-chat { position: absolute; top: 140px; right: 22px; left: 22px; }
        .s6-bub { background: #fff; border-radius: 26px 8px 26px 26px; padding: 20px 24px; box-shadow: 0 10px 20px -12px rgba(31, 51, 90, 0.35); opacity: 0; }
        #s6-msg h6 { font-size: 26px; font-weight: 900; color: var(--blue-d); margin-bottom: 8px; }
        #s6-msg p { font-size: 24px; font-weight: 600; line-height: 1.75; color: var(--ink); }
        #s6-msg p span { color: var(--ink3); }
        #s6-ibtn { margin-top: 10px; height: 64px; border-radius: 18px; background: rgba(255, 255, 255, 0.75); border: 2px solid rgba(42, 171, 238, 0.5);
          display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: 800; color: #1a86c0; opacity: 0; }
        #s6-ok { margin-top: 16px; width: 330px; border-radius: 26px 8px 26px 26px; }
        #s6-ok b { font-size: 27px; font-weight: 900; color: var(--green); }
        #s6-ok small { display: block; font-size: 22px; font-weight: 600; color: var(--ink3); }
        #s6-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 470px; background: #fff; border-radius: 34px 34px 0 0; padding: 30px 32px;
          box-shadow: 0 -20px 40px rgba(31, 51, 90, 0.25); }
        #s6-sheet h6 { font-size: 29px; font-weight: 900; margin-bottom: 18px; }
        .s6-f label { display: block; font-size: 22px; font-weight: 700; color: var(--ink2); margin: 8px 0 6px; }
        .s6-in { position: relative; height: 64px; border-radius: 14px; border: 2px solid rgba(61, 111, 214, 0.3); padding: 0 18px; display: flex; align-items: center; font-size: 28px; font-weight: 800; }
        .s6-sel::after { content: "▾"; position: absolute; left: 18px; top: 13px; font-size: 24px; color: var(--ink3); }
        #s6-acts { display: flex; gap: 16px; margin-top: 24px; }
        #s6-yes, #s6-no { flex: 1; height: 70px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; }
        #s6-yes { background: var(--green); color: #fff; }
        #s6-no { border: 2px solid rgba(179, 38, 62, 0.5); color: var(--red); }
        #s6-finger { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; background: rgba(31, 51, 90, 0.35); border: 3px solid #fff; opacity: 0; }
        #s6-ring { position: absolute; left: 0; top: 0; width: 70px; height: 70px; border-radius: 50%; border: 5px solid rgba(28, 122, 81, 0.9); opacity: 0; }

      <div id="s6-root" data-composition-id="s6-telegram" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s6-wrap">
          <div id="s6-phone">
            <div id="s6-screen">
              <div id="s6-bar">
                <div id="s6-av"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/></svg></div>
                <div><b>ربات حسابداری</b><small>ربات تلگرام آموزشگاه</small></div>
              </div>
              <div id="s6-chat">
                <div class="s6-bub" id="s6-msg">
                  <h6>💰 واریزی تازه · منتظر تأیید</h6>
                  <p><span>پرداخت‌کننده:</span> سارا محمدی (فراگیر)</p>
                  <p><span>مبلغ:</span> ۸۰۰٬۰۰۰ تومان</p>
                  <p><span>دوره:</span> C001 · <span>مدرس پیشنهادی:</span> M001</p>
                  <p><span>درصد پیشنهادی:</span> ۷۰٪</p>
                  <p><span>ثبت‌کننده:</span> فاطمه</p>
                </div>
                <div id="s6-ibtn" data-layout-allow-overlap>✍️ بررسی، درصد و ثبت</div>
                <div class="s6-bub" id="s6-ok"><b>✅ ثبت شد</b><small>در دفتر «درآمد» نشست</small></div>
              </div>
              <div id="s6-sheet" data-layout-allow-overlap data-layout-allow-occlusion>
                <h6 data-layout-allow-overlap>بررسی واریزی سارا محمدی</h6>
                <div class="s6-f"><label>مدرس</label><div class="s6-in s6-sel">M001</div></div>
                <div class="s6-f"><label>درصد مدرس</label><div class="s6-in">۷۰</div></div>
                <div id="s6-acts"><div id="s6-yes">ثبت کن</div><div id="s6-no">رد کن</div></div>
              </div>
              <div id="s6-ring"></div>
              <div id="s6-finger"></div>
            </div>
          </div>

          <div id="s6-head">
            <div id="s6-eyebrow">۳ · تأیید مدیر در تلگرام</div>
            <div id="s6-title">بدون تأیید مدیر، <b>هیچ ردیفی</b> ثبت نمی‌شود</div>
            <div class="s6-pt" id="s6-b1"><i></i>مدرس و درصد را فقط مدیر تعیین می‌کند؛ پیشنهاد سیستم از قبل پر شده.</div>
            <div class="s6-pt" id="s6-b2"><i></i>پیام‌ها مهلت ندارند؛ چند روز بعد هم دکمه کار می‌کند.</div>
            <div id="s6-chip">فرم واریزی، فرم هزینه و وبهوک؛ هر سه از همین مسیر</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s6-phone", { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.1);
          tl.set("#s6-sheet", { y: 480 }, 0);
          tl.fromTo("#s6-msg", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 1.2);
          tl.fromTo("#s6-ibtn", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.8);

          tl.fromTo("#s6-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.fromTo("#s6-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.7);
          tl.fromTo("#s6-b1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.2);
          tl.fromTo("#s6-b2", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.6);
          tl.fromTo("#s6-chip", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 10.2);

          // tap the inline button -> review sheet
          tl.set("#s6-finger", { x: 380, y: 760 }, 5.2);
          tl.to("#s6-finger", { opacity: 1, duration: 0.2 }, 5.2);
          tl.to("#s6-finger", { x: 258, y: 458, duration: 0.8, ease: "power2.inOut" }, 5.4);
          tl.to("#s6-ibtn", { scale: 0.95, background: "rgba(42,171,238,0.2)", duration: 0.12, ease: "power1.out" }, 6.3);
          tl.to("#s6-ibtn", { scale: 1, duration: 0.25, ease: "power2.out" }, 6.42);
          tl.to("#s6-sheet", { y: 0, duration: 0.6, ease: "power3.out" }, 6.6);
          tl.to("#s6-finger", { x: 387, y: 763, duration: 1.4, ease: "power2.inOut" }, 7.4);
          // approve
          tl.set("#s6-ring", { x: 376, y: 752, scale: 0.4 }, 9.3);
          tl.to("#s6-ring", { opacity: 1, scale: 1.6, duration: 0.4, ease: "power2.out" }, 9.3);
          tl.to("#s6-ring", { opacity: 0, duration: 0.25, ease: "power1.in" }, 9.72);
          tl.to("#s6-yes", { scale: 0.95, duration: 0.12, ease: "power1.out" }, 9.3);
          tl.to("#s6-yes", { scale: 1, duration: 0.2, ease: "power2.out" }, 9.42);
          tl.to("#s6-finger", { opacity: 0, duration: 0.2 }, 9.5);
          tl.to("#s6-sheet", { y: 480, duration: 0.5, ease: "power2.in" }, 9.6);
          tl.fromTo("#s6-ok", { opacity: 0, y: 30, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 9.9);

          tl.to("#s6-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 12.0);
          window.__timelines["s6-telegram"] = tl;
        })();
      </script>
    </template>
