        #s8-root { position: absolute; inset: 0; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: var(--ink); }
        #s8-wrap { position: absolute; inset: 0; }
        #s8-head { position: absolute; right: 110px; top: 60px; width: 1100px; direction: rtl; }
        #s8-eyebrow, #s8-title { opacity: 0; }
        #s8-eyebrow { font-size: 30px; font-weight: 700; color: var(--blue-d); }
        #s8-title { margin-top: 6px; font-size: 80px; font-weight: 900; line-height: 1.25; }
        #s8-stats { position: absolute; left: 110px; top: 110px; display: flex; gap: 16px; direction: rtl; }
        .s8-st { padding: 12px 22px; border-radius: 18px; background: rgba(255, 255, 255, 0.88); border: 2px solid var(--card-line); font-size: 27px; font-weight: 700; color: var(--ink2); opacity: 0; }
        .s8-st b { color: var(--green); font-weight: 900; }

        #s8-win { position: absolute; left: 110px; top: 270px; width: 1700px; height: 660px; border-radius: 26px; background: #fff; overflow: hidden;
          box-shadow: 0 50px 100px -40px rgba(31, 51, 90, 0.6); border: 2px solid rgba(31, 51, 90, 0.12); direction: rtl; opacity: 0; }
        #s8-top { height: 78px; display: flex; align-items: center; gap: 16px; padding: 0 26px; border-bottom: 2px solid #e6ebf2; }
        #s8-top .ic { width: 44px; height: 44px; border-radius: 10px; background: #1e8e3e; display: flex; align-items: center; justify-content: center; }
        #s8-top b { font-size: 27px; font-weight: 800; }
        #s8-fx { height: 56px; display: flex; align-items: center; padding: 0 26px; border-bottom: 2px solid #e6ebf2; font-size: 23px; color: var(--ink3); font-weight: 600; }
        #s8-grids { position: relative; height: 400px; }
        .s8-grid { position: absolute; inset: 0; }
        .s8-row { display: flex; height: 64px; border-bottom: 2px solid #eef1f6; }
        .s8-row > div { flex-shrink: 0; padding: 0 12px; display: flex; align-items: center; border-left: 2px solid #eef1f6; font-size: 23px; font-weight: 600; white-space: nowrap; overflow: hidden; }
        .s8-h > div { background: #f1f5fb; font-weight: 800; color: var(--ink2); font-size: 22px; }
        .s8-new > div { background: #fff; }
        .s8-mark { position: absolute; right: 0; left: 0; top: 64px; height: 64px; border: 3px solid #1e8e3e; background: rgba(30, 142, 62, 0.08); opacity: 0; }
        .s8-link { color: var(--blue-d); font-weight: 800; }
        .s8-num { font-weight: 800; }
        #s8-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #f1f5fb; border-top: 2px solid #e6ebf2; display: flex; align-items: center; gap: 6px; padding: 0 18px; overflow: hidden; }
        .s8-tab { flex-shrink: 0; padding: 8px 18px; border-radius: 10px; font-size: 22px; font-weight: 700; color: var(--ink2); }
        .s8-tab.on { background: #fff; color: #146c2e; box-shadow: inset 0 -4px 0 #1e8e3e; }
        #s8-drive { position: absolute; left: 170px; top: 540px; width: 640px; padding: 20px 24px; border-radius: 22px; background: #fff; border: 2px solid rgba(244, 180, 0, 0.6);
          box-shadow: 0 30px 60px -24px rgba(31, 51, 90, 0.55); direction: rtl; display: flex; gap: 16px; align-items: center; opacity: 0; }
        #s8-drive .ic { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(160deg, #ffd766, #f4b400); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #s8-drive b { display: block; font-size: 25px; font-weight: 900; }
        #s8-drive small { display: block; font-size: 22px; font-weight: 600; color: var(--ink3); }

      <div id="s8-root" data-composition-id="s8-sheet" data-width="1920" data-height="1080" data-duration="10.6">
        <div id="s8-wrap">
          <div id="s8-head">
            <div id="s8-eyebrow">۵ · دفتر حسابداری</div>
            <div id="s8-title">همه‌چیز در یک گوگل‌شیت فارسی</div>

            <div class="s8-st"><b>۱۷</b> شیت راست‌چین</div>

          </div>

          <div id="s8-win">
            <div id="s8-top"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></svg></div><b>دفتر حسابداری آموزشگاه علمی فردا</b></div>

                <div class="s8-row s8-h"><div style="width:150px">تاریخ_شمسی</div><div style="width:150px">نوع_درآمد</div><div style="width:170px">پرداخت_کننده</div><div style="width:110px">کد_کلاس</div><div style="width:110px">کد_مدرس</div><div style="width:140px">مبلغ</div><div style="width:160px">روش_پرداخت</div><div style="width:130px">درصد_مدرس</div><div style="width:150px">سهم_مدرس</div><div style="width:170px">سهم_آموزشگاه</div><div style="width:156px">لینک_فاکتور</div></div>
                <div class="s8-row s8-new" id="s8-r1"><div style="width:150px">۱۴۰۵/۰۵/۱۸</div><div style="width:150px">شهریه فراگیر</div><div style="width:170px">سارا محمدی</div><div style="width:110px">C001</div><div style="width:110px">M001</div><div style="width:140px" class="s8-num">۸۰۰٬۰۰۰</div><div style="width:160px">کارت به کارت</div><div style="width:130px" class="s8-num">۷۰</div><div style="width:150px" class="s8-num">۵۶۰٬۰۰۰</div><div style="width:170px" class="s8-num">۲۴۰٬۰۰۰</div><div style="width:156px" class="s8-link">📎 عکس فیش</div></div>

          <div id="s8-drive" data-layout-allow-overlap>
            <div class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M8 3h8l6 10-4 7H6l-4-7z"/></svg></div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s8-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);
          tl.fromTo("#s8-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
          tl.fromTo("#s8-title", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.4);
          tl.fromTo("#s8-win", { opacity: 0, y: 120, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.5);
          gsap.utils.toArray("#s8-root .s8-st").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 2.6 + i * 0.3);
          });
          tl.set("#s8-g2", { opacity: 0 }, 0);

          // the approved payment lands as a new row
          tl.fromTo("#s8-r1", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.0);
          tl.fromTo("#s8-m1", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.3);
          tl.to("#s8-m1", { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 3.4);

          // switch to the expenses tab
          tl.to("#s8-t1", { backgroundColor: "rgba(255,255,255,0)", color: "#34507f", boxShadow: "inset 0 -4px 0 rgba(30,142,62,0)", duration: 0.2 }, 5.5);
          tl.to("#s8-t2", { backgroundColor: "#ffffff", color: "#146c2e", boxShadow: "inset 0 -4px 0 #1e8e3e", duration: 0.2 }, 5.5);
          tl.to("#s8-g1", { opacity: 0, duration: 0.25, ease: "power1.in" }, 5.55);
          tl.to("#s8-g2", { opacity: 1, duration: 0.25, ease: "power1.out" }, 5.7);
          tl.fromTo("#s8-r2", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.3);
          tl.fromTo("#s8-m2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.6);
          tl.fromTo("#s8-drive", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 7.0);

          tl.to("#s8-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 10.0);
          window.__timelines["s8-sheet"] = tl;
        })();
      </script>
