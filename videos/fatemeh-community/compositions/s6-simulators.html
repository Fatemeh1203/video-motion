<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-simulators-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #s6-wrap {
          position: absolute;
          inset: 0;
        }
        #s6-stage {
          position: absolute;
          left: 80px;
          top: 150px;
          width: 1060px;
          height: 780px;
          perspective: 2400px;
        }
        #s6-win {
          position: absolute;
          inset: 0;
          border-radius: 26px;
          overflow: hidden;
          border: 2px solid rgba(255, 255, 255, 0.14);
          background: #05070f;
          box-shadow: 0 40px 140px rgba(0, 0, 0, 0.7), 0 0 90px rgba(255, 191, 134, 0.16);
          opacity: 0;
        }
        #s6-video {
          position: absolute;
          left: -780px;
          top: -20px;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s6-glow {
          position: absolute;
          width: 1300px;
          height: 1300px;
          right: -400px;
          top: -300px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 191, 134, 0.16), rgba(255, 191, 134, 0) 62%);
        }
        #s6-copy {
          position: absolute;
          right: 130px;
          top: 210px;
          width: 620px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 18px;
        }
        #s6-copy > * {
          opacity: 0;
        }
        #s6-badge {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 12px 24px;
          border-radius: 40px;
          background: var(--p4);
          color: #1a0f04;
          font-size: 30px;
          font-weight: 800;
          box-shadow: 0 0 40px rgba(255, 191, 134, 0.45);
        }
        #s6-lock {
          display: block;
          overflow: visible;
        }
        #s6-title {
          font-size: 92px;
          font-weight: 900;
          line-height: 1.25;
        }
        #s6-sub {
          font-size: 38px;
          font-weight: 400;
          line-height: 1.6;
          color: var(--muted);
        }
        #s6-count {
          display: flex;
          align-items: baseline;
          gap: 16px;
          margin-top: 6px;
        }
        #s6-count b {
          font-size: 110px;
          font-weight: 900;
          line-height: 1;
          color: var(--p4);
          font-variant-numeric: tabular-nums;
        }
        #s6-count span {
          font-size: 36px;
          font-weight: 600;
        }
      </style>

      <div id="s6-root" data-composition-id="s6-simulators" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s6-wrap">
          <div id="s6-glow"></div>
          <div id="s6-stage">
            <div id="s6-win">
              <video id="s6-video" class="clip" src="assets/clips/simulators.mp4" data-start="0" data-duration="12.6" data-playback-rate="0.47" data-track-index="0" muted playsinline></video>
            </div>
          </div>

          <div id="s6-copy">
            <div id="s6-badge">
              <svg id="s6-lock" width="30" height="34" viewBox="0 0 30 34" fill="none" stroke="#1a0f04" stroke-width="3.4" stroke-linecap="round">
                <rect x="3" y="15" width="24" height="17" rx="4" fill="#1a0f04" />
                <path id="s6-shackle" d="M8 15 V10 a7 7 0 0 1 14 0 V15" />
              </svg>
              <span>رایگان، فقط برای اعضای کامیونیتی</span>
            </div>
            <div id="s6-title">شبیه‌سازهای آموزشی</div>
            <div id="s6-sub">آزمایشگاه‌های تعاملی ریاضی، فیزیک و برنامه‌نویسی که مستقیم در مرورگر اجرا می‌شوند.</div>
            <div id="s6-count"><b id="s6-n">۰</b><span>شبیه‌ساز، آمادهٔ استفاده</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";

          tl.fromTo("#s6-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo(
            "#s6-win",
            { opacity: 0, rotationY: 18, y: 90, scale: 0.9 },
            { opacity: 1, rotationY: 6, y: 0, scale: 1, duration: 1.2, ease: "power3.out" },
            0.2,
          );
          tl.to("#s6-win", { rotationY: 2, scale: 1.03, duration: 11, ease: "sine.inOut" }, 1.4);

          // badge pops locked, then the lock opens (chime)
          tl.fromTo("#s6-badge", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 0.8);
          tl.fromTo("#s6-shackle", { y: 0, rotation: 0, transformOrigin: "22px 15px" }, { y: -4, rotation: 35, duration: 0.45, ease: "back.out(3)" }, 2.6);
          tl.fromTo("#s6-badge", { boxShadow: "0 0 40px rgba(255,191,134,0.45)" }, { boxShadow: "0 0 90px rgba(255,191,134,0.9)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.6);

          tl.set("#s6-title", { opacity: 1, y: 80 }, 1.3);
          tl.to("#s6-title", { y: 0, duration: 0.22, ease: "power4.out" }, 1.3);
          tl.fromTo("#s6-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.8);
          tl.fromTo("#s6-count", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.4);
          const n = document.querySelector("#s6-n");
          const c = { v: 0 };
          tl.fromTo(
            c,
            { v: 0 },
            {
              v: 20,
              duration: 1.6,
              ease: "power2.out",
              onUpdate: function () {
                n.textContent = String(Math.round(c.v)).replace(/[0-9]/g, function (d) {
                  return FA[+d];
                });
              },
            },
            3.5,
          );

          tl.to("#s6-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 12.0);

          window.__timelines["s6-simulators"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
