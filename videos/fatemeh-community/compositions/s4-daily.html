<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s4-daily-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s4-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #s4-wrap {
          position: absolute;
          inset: 0;
        }
        #s4-glow {
          position: absolute;
          width: 1500px;
          height: 1500px;
          left: -500px;
          top: 50px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(137, 255, 240, 0.14), rgba(137, 255, 240, 0) 62%);
        }
        #s4-glow2 {
          position: absolute;
          width: 1200px;
          height: 1200px;
          right: -400px;
          top: -600px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(174, 156, 255, 0.2), rgba(174, 156, 255, 0) 62%);
        }
        #s4-head {
          position: absolute;
          right: 140px;
          top: 70px;
          width: 1100px;
          direction: rtl;
        }
        #s4-head > * {
          opacity: 0;
        }
        #s4-eyebrow {
          font-size: 32px;
          font-weight: 600;
          color: var(--mint);
          margin-bottom: 8px;
        }
        #s4-title {
          font-size: 100px;
          font-weight: 900;
          line-height: 1.25;
        }
        #s4-sub {
          margin-top: 10px;
          font-size: 38px;
          font-weight: 400;
          color: var(--muted);
        }
        #s4-week {
          position: absolute;
          left: 140px;
          top: 110px;
          display: flex;
          flex-direction: row-reverse;
          gap: 14px;
          direction: rtl;
        }
        .s4-day {
          width: 82px;
          height: 108px;
          border-radius: 18px;
          border: 2px solid rgba(255, 255, 255, 0.14);
          background: rgba(18, 24, 42, 0.9);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 10px;
          font-size: 22px;
          font-weight: 600;
          color: var(--muted);
          opacity: 0;
        }
        .s4-day b {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .s4-day b i {
          position: absolute;
          inset: -2px;
          border-radius: 50%;
          background: var(--mint);
          box-shadow: 0 0 18px var(--mint);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #s4-post {
          position: absolute;
          right: 140px;
          top: 440px;
          width: 1040px;
          border-radius: 30px;
          background: linear-gradient(145deg, rgba(23, 29, 48, 0.97), rgba(9, 14, 26, 0.97));
          border: 2px solid rgba(255, 255, 255, 0.14);
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
          padding: 38px 48px 34px;
          direction: rtl;
          opacity: 0;
        }
        #s4-chip {
          display: inline-block;
          padding: 6px 18px;
          border-radius: 30px;
          background: rgba(174, 156, 255, 0.18);
          color: #cdbfff;
          font-size: 24px;
          font-weight: 700;
        }
        #s4-post h5 {
          margin-top: 14px;
          font-size: 46px;
          font-weight: 900;
        }
        #s4-p1 {
          margin-top: 10px;
          font-size: 32px;
          font-weight: 500;
          line-height: 1.55;
          opacity: 0;
        }
        #s4-k {
          margin-top: 16px;
          font-size: 28px;
          font-weight: 800;
          color: var(--p4);
          opacity: 0;
        }
        #s4-out {
          margin-top: 10px;
          border-radius: 18px;
          border: 2px solid rgba(137, 255, 240, 0.25);
          background: rgba(255, 255, 255, 0.05);
          padding: 18px 26px;
          font-size: 32px;
          font-weight: 500;
          line-height: 1.6;
          min-height: 124px;
          opacity: 0;
        }
        #s4-ring {
          position: absolute;
          left: 170px;
          top: 440px;
          width: 470px;
          height: 470px;
          opacity: 0;
        }
        #s4-ring svg {
          position: absolute;
          inset: 0;
          width: 470px;
          height: 470px;
          transform: rotate(-90deg);
        }
        #s4-ring-num {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          direction: rtl;
        }
        #s4-num {
          font-size: 128px;
          font-weight: 900;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          color: var(--mint);
        }
        #s4-ring-num span {
          margin-top: 12px;
          max-width: 300px;
          text-align: center;
          font-size: 28px;
          line-height: 1.5;
          color: var(--muted);
        }
      </style>

      <div id="s4-root" data-composition-id="s4-daily" data-width="1920" data-height="1080" data-duration="14.6">
        <div id="s4-wrap">
          <div id="s4-glow"></div>
          <div id="s4-glow2"></div>

          <div id="s4-head">
            <div id="s4-eyebrow">در کامیونیتی</div>
            <div id="s4-title">هر روز، یک درس تازه</div>
            <div id="s4-sub">آموزش کاربردی همهٔ ابزارهای هوش مصنوعی؛ روزبه‌روز و قدم‌به‌قدم.</div>
          </div>

          <div id="s4-week">
            <div class="s4-day"><span>شنبه</span><b><i></i></b></div>
            <div class="s4-day"><span>یکشنبه</span><b><i></i></b></div>
            <div class="s4-day"><span>دوشنبه</span><b><i></i></b></div>
            <div class="s4-day"><span>سه‌شنبه</span><b><i></i></b></div>
            <div class="s4-day"><span>چهارشنبه</span><b><i></i></b></div>
          </div>

          <div id="s4-ring">
            <svg viewBox="0 0 470 470">
              <circle cx="235" cy="235" r="200" fill="none" stroke="#1d2542" stroke-width="38" />
              <circle id="s4-arc" cx="235" cy="235" r="200" fill="none" stroke="#89fff0" stroke-width="38" stroke-linecap="round" stroke-dasharray="1257 1257" stroke-dashoffset="1257" />
            </svg>
            <div id="s4-ring-num">
              <b id="s4-num">۰٪</b>
              <span>سهم کیف‌های چرمی از کل درآمد</span>
            </div>
          </div>

          <div id="s4-post">
            <div id="s4-chip">ابزار هوش مصنوعی</div>
            <h5>درس ۹ — تحلیل داده با آپلود فایل</h5>
            <div id="s4-p1">تصویر فاکتور خرید خودت را آپلود کن و بخواه آن را تحلیل کند.</div>
            <div id="s4-k">خروجی باید شبیه این باشد:</div>
            <div id="s4-out"><span id="s4-out-t"></span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          const faNum = function (n) {
            return String(n).replace(/[0-9]/g, function (d) {
              return FA[+d];
            });
          };

          tl.fromTo("#s4-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s4-glow", { scale: 0.9 }, { scale: 1.1, duration: 14.6, ease: "sine.inOut" }, 0);

          tl.fromTo("#s4-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);
          tl.set("#s4-title", { opacity: 1, y: 80 }, 0.7);
          tl.to("#s4-title", { y: 0, duration: 0.22, ease: "power4.out" }, 0.7);
          tl.fromTo("#s4-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.1);

          // the week fills in, one lesson a day
          gsap.utils.toArray("#s4-root .s4-day").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 1.4 + i * 0.1);
            tl.fromTo(el.querySelector("i"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.6 + i * 0.4);
            tl.to(el, { borderColor: "rgba(137,255,240,0.7)", color: "#eff4ff", duration: 0.3, ease: "power1.out" }, 1.6 + i * 0.4);
          });

          // today's lesson: the real post from the channel
          tl.fromTo("#s4-post", { opacity: 0, y: 80, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 4.6);
          tl.fromTo("#s4-p1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.4);
          tl.fromTo("#s4-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.4);
          tl.fromTo("#s4-out", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 6.9);
          (function () {
            const text = Array.from("تحلیل فروش: بیشترین سهم فروش متعلق به کیف‌های چرمی با ۴۵ درصد درآمد کل است.");
            const el = document.querySelector("#s4-out-t");
            const st = { n: 0 };
            tl.fromTo(
              st,
              { n: 0 },
              {
                n: text.length,
                duration: 3.0,
                ease: "none",
                onUpdate: function () {
                  el.textContent = text.slice(0, Math.round(st.n)).join("");
                },
              },
              7.2,
            );
          })();

          // stat-bars-and-fills + counting-dynamic-scale
          tl.fromTo("#s4-ring", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 8.0);
          tl.fromTo("#s4-arc", { strokeDashoffset: 1257 }, { strokeDashoffset: 1257 * 0.55, duration: 2.4, ease: "power2.out" }, 8.5);
          const num = document.querySelector("#s4-num");
          const cnt = { v: 0 };
          tl.fromTo(
            cnt,
            { v: 0 },
            {
              v: 45,
              duration: 2.4,
              ease: "power2.out",
              onUpdate: function () {
                num.textContent = faNum(Math.round(cnt.v)) + "٪";
              },
            },
            8.5,
          );
          tl.fromTo("#s4-num", { scale: 0.7 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 8.5);

          tl.to("#s4-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 14.0);

          window.__timelines["s4-daily"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
