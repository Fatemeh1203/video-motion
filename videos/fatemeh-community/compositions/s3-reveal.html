<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s3-reveal-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s3-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #s3-wrap,
        #s3-cam {
          position: absolute;
          inset: 0;
        }
        #s3-video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s3-dim {
          position: absolute;
          inset: 0;
          background: linear-gradient(270deg, rgba(8, 11, 21, 0.9) 0%, rgba(8, 11, 21, 0.7) 45%, rgba(8, 11, 21, 0.35) 100%);
        }
        #s3-copy {
          position: absolute;
          right: 140px;
          top: 200px;
          width: 860px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }
        #s3-copy > * {
          opacity: 0;
        }
        #s3-eyebrow {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 36px;
          font-weight: 600;
          color: var(--p3);
        }
        .s3-plane {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: #2aa3de;
        }
        #s3-title {
          font-size: 90px;
          font-weight: 900;
          line-height: 1.3;
        }
        #s3-title em {
          font-style: normal;
          white-space: nowrap;
          background: linear-gradient(100deg, #ae9cff, #a8ffef 80%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        #s3-sub {
          font-size: 40px;
          font-weight: 400;
          line-height: 1.6;
          color: var(--muted);
        }
        #s3-panel {
          position: absolute;
          left: 170px;
          top: 110px;
          width: 640px;
          border-radius: 36px;
          background: rgba(14, 19, 34, 0.94);
          border: 2px solid rgba(255, 255, 255, 0.14);
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
          overflow: hidden;
          direction: rtl;
          opacity: 0;
        }
        #s3-head {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 28px 34px;
          background: #121a30;
          border-bottom: 2px solid rgba(255, 255, 255, 0.12);
        }
        #s3-avatar {
          width: 70px;
          height: 70px;
          border-radius: 50%;
          background: radial-gradient(circle at 50% 70%, #a8ffef, #89fff0 35%, #ae9cff 100%);
          flex: none;
        }
        #s3-head b {
          display: block;
          font-size: 34px;
          font-weight: 800;
          direction: ltr;
          text-align: right;
        }
        #s3-head span {
          font-size: 24px;
          color: var(--muted);
        }
        .s3-topic {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 18px 34px;
          border-bottom: 2px solid rgba(255, 255, 255, 0.07);
          font-size: 33px;
          font-weight: 700;
          opacity: 0;
        }
        .s3-topic i {
          display: block;
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: var(--c);
          box-shadow: 0 0 16px var(--c);
          flex: none;
        }
      </style>

      <div id="s3-root" data-composition-id="s3-reveal" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s3-wrap">
          <div id="s3-cam">
            <video id="s3-video" class="clip" src="assets/clips/community-clean.mp4" data-start="0" data-duration="12.6" data-playback-rate="0.47" data-track-index="0" muted playsinline></video>
          </div>
          <div id="s3-dim"></div>

          <div id="s3-panel">
            <div id="s3-head">
              <div id="s3-avatar"></div>
              <div><b>AI_Community</b><span>تاپیک‌های کامیونیتی</span></div>
            </div>
            <div class="s3-topic" style="--c: #b39aff"><i></i><span>ابزار هوش مصنوعی</span></div>
            <div class="s3-topic" style="--c: #ffbf86"><i></i><span>بانک پرامپت ویژهٔ معلم</span></div>
            <div class="s3-topic" style="--c: #77caff"><i></i><span>فایل‌ها</span></div>
            <div class="s3-topic" style="--c: #ff94ba"><i></i><span>شبیه‌ساز</span></div>
            <div class="s3-topic" style="--c: #ddf998"><i></i><span>ایده</span></div>
            <div class="s3-topic" style="--c: #91ffea"><i></i><span>نمونه‌کارها</span></div>
            <div class="s3-topic" style="--c: #b39aff"><i></i><span>پرسش و پاسخ</span></div>
          </div>

          <div id="s3-copy">
            <div id="s3-eyebrow">
              <span class="s3-plane"
                ><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.6Z" /></svg
              ></span>
              <span>کامیونیتی هوش مصنوعی در تلگرام</span>
            </div>
            <div id="s3-title">اینجا جای کسانی است که می‌خواهند <em>متحول شوند.</em></div>
            <div id="s3-sub">یک مسیر روشن برای یادگیری، کنار آدم‌هایی که همین راه را می‌روند.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s3-cam", { scale: 1.12 }, { scale: 1.0, duration: 12.6, ease: "sine.out" }, 0);

          tl.fromTo("#s3-eyebrow", { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.5);
          tl.fromTo(".s3-plane", { rotation: -35, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.4)" }, 0.55);
          tl.fromTo("#s3-title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 1.1);
          tl.fromTo("#s3-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 2.4);

          // the community opens: panel springs in with its topics
          tl.fromTo("#s3-panel", { opacity: 0, y: 110, rotation: -2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "back.out(1.3)" }, 3.3);
          gsap.utils.toArray("#s3-root .s3-topic").forEach(function (el, i) {
            const at = 3.9 + i * 0.12;
            tl.fromTo(el, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
            tl.fromTo(el.querySelector("i"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, at + 0.1);
          });
          tl.fromTo("#s3-panel", { y: 0 }, { y: -14, duration: 3.6, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 4.8);

          tl.to("#s3-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 12.0);

          window.__timelines["s3-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
