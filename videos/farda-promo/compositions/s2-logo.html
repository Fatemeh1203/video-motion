<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s2-logo-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s2-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--ink);
          background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 26%, var(--sky-3) 52%, var(--sky-4) 100%);
        }
        #s2-wrap {
          position: absolute;
          inset: 0;
        }
        .s2-cloud {
          position: absolute;
          border-radius: 200px;
          background: radial-gradient(60% 90% at 45% 60%, #fff 0%, #eef5ff 60%, rgba(238, 245, 255, 0) 74%);
          box-shadow: 0 50px 70px -40px rgba(90, 130, 200, 0.45);
        }
        #s2-c1 { left: -140px; top: 120px; width: 560px; height: 200px; }
        #s2-c2 { right: -140px; top: 60px; width: 620px; height: 220px; }
        #s2-c3 { right: 120px; bottom: 60px; width: 460px; height: 170px; }
        #s2-c4 { left: 80px; bottom: -40px; width: 540px; height: 190px; }

        #s2-rays {
          position: absolute;
          left: 460px;
          top: 40px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.5) 0deg 6deg, rgba(255, 255, 255, 0) 6deg 18deg);
          -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 68%);
          mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 68%);
        }
        #s2-emblem {
          position: absolute;
          left: 700px;
          top: 90px;
          width: 520px;
          height: 520px;
          border-radius: 50%;
          background: radial-gradient(70% 70% at 50% 35%, #fff 0%, #f0f6ff 100%);
          box-shadow: 0 60px 90px -40px rgba(80, 120, 195, 0.6), inset 0 -14px 30px rgba(150, 185, 240, 0.3), inset 0 14px 30px rgba(255, 255, 255, 0.95);
        }
        #s2-mark {
          position: absolute;
          left: 760px;
          top: 160px;
          width: 400px;
          height: 280px;
        }
        #s2-mark img {
          position: absolute;
          left: 0;
          top: 0;
          width: 400px;
          height: 280px;
        }
        #s2-name {
          position: absolute;
          left: 0;
          right: 0;
          top: 650px;
          display: flex;
          justify-content: center;
          gap: 28px;
          direction: rtl;
          font-size: 104px;
          font-weight: 900;
          color: var(--ink-strong);
          line-height: 1.3;
        }
        .s2-w {
          display: inline-block;
          opacity: 0;
        }
        #s2-slogan {
          position: absolute;
          left: 0;
          right: 0;
          top: 810px;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 20px;
          direction: rtl;
          font-size: 56px;
          font-weight: 500;
          color: var(--blue);
        }
        .s2-sw {
          display: inline-block;
          opacity: 0;
        }
        .s2-bar {
          width: 90px;
          height: 4px;
          border-radius: 2px;
          background: var(--dot);
        }
        #s2-bar-r { transform-origin: left center; }
        #s2-bar-l { transform-origin: right center; }
      </style>

      <div id="s2-root" data-composition-id="s2-logo" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s2-wrap">
          <div class="s2-cloud" id="s2-c1"></div>
          <div class="s2-cloud" id="s2-c2"></div>
          <div class="s2-cloud" id="s2-c3"></div>
          <div class="s2-cloud" id="s2-c4"></div>
          <div id="s2-rays"></div>
          <div id="s2-emblem"></div>
          <div id="s2-mark"><img src="assets/img/farda-mark-navy.png" alt="" /></div>

          <div id="s2-name">
            <span class="s2-w">آموزشگاه</span><span class="s2-w">علمی</span><span class="s2-w">فردا</span>
          </div>
          <div id="s2-slogan">
            <span class="s2-bar" id="s2-bar-r"></span>
            <span class="s2-sw">از</span><span class="s2-sw">امروز</span><span class="s2-sw">به</span><span class="s2-sw">فردا</span><span class="s2-sw">بیایید</span>
            <span class="s2-bar" id="s2-bar-l"></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const D = 12.6;

          tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s2-c1", { x: -40 }, { x: 120, duration: D, ease: "none" }, 0);
          tl.fromTo("#s2-c2", { x: 40 }, { x: -110, duration: D, ease: "none" }, 0);
          tl.fromTo("#s2-c3", { x: 0 }, { x: -80, duration: D, ease: "none" }, 0);
          tl.fromTo("#s2-c4", { x: 0 }, { x: 90, duration: D, ease: "none" }, 0);

          // rays bloom + slow rotation
          tl.fromTo("#s2-rays", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0.3);
          tl.fromTo("#s2-rays", { rotation: 0 }, { rotation: 40, duration: D, ease: "none", immediateRender: false }, 0);

          // emblem spring-pop
          tl.fromTo("#s2-emblem", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "back.out(1.7)" }, 0.4);

          gsap.set("#s2-mark", { clipPath: "inset(0% 0% 0% 100%)", scale: 0.92 });
          // calligraphy "written" right-to-left (the pen direction of Persian)
          tl.fromTo("#s2-mark", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.8, ease: "power2.inOut", immediateRender: false }, 1.0);
          tl.fromTo("#s2-mark", { scale: 0.92 }, { scale: 1, duration: 2.2, ease: "power2.out", immediateRender: false }, 1.0);

          // name
          gsap.utils.toArray("#s2-root .s2-w").forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, ease: "power4.out" }, 3.0 + i * 0.22);
          });

          // slogan
          tl.fromTo("#s2-bar-r", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 4.1);
          tl.fromTo("#s2-bar-l", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 4.1);
          gsap.utils.toArray("#s2-root .s2-sw").forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.3 + i * 0.2);
          });

          // hold with a gentle float, then emblem pulse
          tl.to("#s2-emblem, #s2-mark", { y: -14, duration: 3.2, ease: "sine.inOut" }, 6.0);
          tl.to("#s2-emblem, #s2-mark", { y: 0, duration: 3.0, ease: "sine.inOut" }, 9.2);
          tl.to("#s2-name", { scale: 1.03, duration: 5.5, ease: "sine.inOut" }, 6.0);

          tl.to("#s2-wrap", { opacity: 0, scale: 1.05, duration: 0.6, ease: "power1.in" }, 12.0);

          window.__timelines["s2-logo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
