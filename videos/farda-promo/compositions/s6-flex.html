<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-flex-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--ink);
          background: linear-gradient(160deg, var(--sky-4) 0%, var(--sky-3) 45%, var(--sky-2) 100%);
        }
        #s6-wrap {
          position: absolute;
          inset: 0;
        }
        .s6-cloud {
          position: absolute;
          border-radius: 200px;
          background: radial-gradient(60% 90% at 45% 60%, #fff 0%, #eef5ff 60%, rgba(238, 245, 255, 0) 74%);
        }
        #s6-c1 { right: -140px; top: 40px; width: 560px; height: 200px; }
        #s6-c2 { left: -100px; bottom: 30px; width: 520px; height: 190px; }

        /* phase A: toggle */
        #s6-a {
          position: absolute;
          inset: 0;
        }
        #s6-a-h {
          position: absolute;
          left: 0;
          right: 0;
          top: 230px;
          text-align: center;
          direction: rtl;
          font-size: 92px;
          font-weight: 900;
          color: var(--ink-strong);
          opacity: 0;
        }
        #s6-toggle {
          position: absolute;
          left: 560px;
          top: 440px;
          width: 800px;
          height: 170px;
          border-radius: 999px;
          background: #fff;
          box-shadow: 0 50px 80px -40px rgba(61, 111, 214, 0.6);
          direction: rtl;
          opacity: 0;
        }
        #s6-knob {
          position: absolute;
          right: 14px;
          top: 14px;
          width: 386px;
          height: 142px;
          border-radius: 999px;
          background: var(--blue);
          box-shadow: 0 20px 40px -18px rgba(61, 111, 214, 0.9);
        }
        .s6-opt {
          position: absolute;
          top: 0;
          width: 400px;
          height: 170px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 18px;
          font-size: 56px;
          font-weight: 800;
        }
        .s6-opt svg {
          width: 56px;
          height: 56px;
        }
        .s6-opt svg * {
          fill: none;
          stroke: currentColor;
          stroke-width: 5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #s6-opt-1 { right: 0; color: #fff; }
        #s6-opt-2 { left: 0; color: var(--ink-soft); }
        #s6-a-p {
          position: absolute;
          left: 0;
          right: 0;
          top: 690px;
          text-align: center;
          direction: rtl;
          font-size: 48px;
          font-weight: 500;
          color: var(--ink-soft);
          opacity: 0;
        }
        #s6-a-p b {
          color: var(--blue);
          font-weight: 800;
        }

        /* phase B: weekly plan */
        #s6-b {
          position: absolute;
          inset: 0;
          opacity: 0;
        }
        #s6-b-h {
          position: absolute;
          left: 0;
          right: 0;
          top: 90px;
          text-align: center;
          direction: rtl;
          font-size: 76px;
          font-weight: 900;
          color: var(--ink-strong);
        }
        #s6-b-h span {
          color: var(--blue);
        }
        #s6-week {
          position: absolute;
          left: 150px;
          right: 150px;
          top: 270px;
          height: 660px;
          display: flex;
          direction: rtl;
          gap: 22px;
          padding: 28px;
          border-radius: 40px;
          background: rgba(255, 255, 255, 0.75);
          box-shadow: 0 50px 80px -44px rgba(61, 111, 214, 0.55);
        }
        .s6-day {
          flex: 1;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .s6-dn {
          height: 84px;
          border-radius: 22px;
          background: var(--sky-2);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 38px;
          font-weight: 800;
          color: var(--ink-strong);
        }
        .s6-slot {
          height: 150px;
          border-radius: 24px;
          border: 3px dashed rgba(61, 111, 214, 0.22);
          position: relative;
        }
        .s6-chip {
          position: absolute;
          inset: -3px;
          border-radius: 24px;
          padding: 20px 20px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 6px;
          color: #fff;
          opacity: 0;
        }
        .s6-chip b {
          font-size: 36px;
          font-weight: 800;
          line-height: 1.3;
        }
        .s6-chip small {
          font-size: 26px;
          font-weight: 500;
          opacity: 0.92;
        }
        .s6-k1 { background: linear-gradient(135deg, #3d6fd6, #2a54ad); }
        .s6-k2 { background: linear-gradient(135deg, #1f335a, #3d5686); }
        .s6-k3 { background: linear-gradient(135deg, #b86e00, #9a5b00); }
        .s6-k4 { background: linear-gradient(135deg, #2f6f73, #1f5357); }
      </style>

      <div id="s6-root" data-composition-id="s6-flex" data-width="1920" data-height="1080" data-duration="16.6">
        <div id="s6-wrap">
          <div class="s6-cloud" id="s6-c1"></div>
          <div class="s6-cloud" id="s6-c2"></div>

          <div id="s6-a">
            <div id="s6-a-h">هر طور که راحت‌ترید</div>
            <div id="s6-toggle">
              <div id="s6-knob"></div>
              <div class="s6-opt" id="s6-opt-1">
                <svg viewBox="0 0 56 56"><path d="M8 26 L28 10 L48 26 M14 22 V46 H42 V22" /><path d="M24 46 V34 H32 V46" /></svg>
                <span>حضوری</span>
              </div>
              <div class="s6-opt" id="s6-opt-2">
                <svg viewBox="0 0 56 56"><rect x="6" y="10" width="44" height="30" rx="5" /><path d="M18 48 H38 M28 40 V48" /></svg>
                <span>آنلاین</span>
              </div>
            </div>
            <div id="s6-a-p">کلاس‌ها <b>حضوری</b> و <b>آنلاین</b> برگزار می‌شوند</div>
          </div>

          <div id="s6-b">
            <div id="s6-b-h">یک برنامهٔ <span>منظم</span>، فقط برای شما</div>
            <div id="s6-week">
              <div class="s6-day"><div class="s6-dn">شنبه</div>
                <div class="s6-slot"><div class="s6-chip s6-k1"><b>کلاس علمی</b><small>حضوری</small></div></div>
                <div class="s6-slot"></div>
                <div class="s6-slot"><div class="s6-chip s6-k4"><b>رفع اشکال</b><small>آنلاین</small></div></div>
              </div>
              <div class="s6-day"><div class="s6-dn">یکشنبه</div>
                <div class="s6-slot"></div>
                <div class="s6-slot"><div class="s6-chip s6-k2"><b>هوش مصنوعی</b><small>آنلاین</small></div></div>
                <div class="s6-slot"></div>
              </div>
              <div class="s6-day"><div class="s6-dn">دوشنبه</div>
                <div class="s6-slot"><div class="s6-chip s6-k3"><b>شبیه‌ساز</b><small>حضوری</small></div></div>
                <div class="s6-slot"></div>
                <div class="s6-slot"></div>
              </div>
              <div class="s6-day"><div class="s6-dn">سه‌شنبه</div>
                <div class="s6-slot"></div>
                <div class="s6-slot"><div class="s6-chip s6-k1"><b>کلاس علمی</b><small>حضوری</small></div></div>
                <div class="s6-slot"></div>
              </div>
              <div class="s6-day"><div class="s6-dn">چهارشنبه</div>
                <div class="s6-slot"></div>
                <div class="s6-slot"></div>
                <div class="s6-slot"><div class="s6-chip s6-k2"><b>پروژه</b><small>آنلاین</small></div></div>
              </div>
              <div class="s6-day"><div class="s6-dn">پنجشنبه</div>
                <div class="s6-slot"><div class="s6-chip s6-k4"><b>مرور هفته</b><small>آنلاین</small></div></div>
                <div class="s6-slot"></div>
                <div class="s6-slot"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const D = 16.6;

          tl.fromTo("#s6-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s6-c1", { x: 0 }, { x: -150, duration: D, ease: "none" }, 0);
          tl.fromTo("#s6-c2", { x: 0 }, { x: 150, duration: D, ease: "none" }, 0);

          // phase A: toggle flips حضوری -> آنلاین -> حضوری
          tl.fromTo("#s6-a-h", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 0.5);
          tl.fromTo("#s6-toggle", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 1.0);
          tl.to("#s6-knob", { x: -386, duration: 0.55, ease: "power3.inOut" }, 2.6);
          tl.to("#s6-opt-1", { color: "#3d5686", duration: 0.3 }, 2.7);
          tl.to("#s6-opt-2", { color: "#ffffff", duration: 0.3 }, 2.8);
          tl.to("#s6-knob", { x: 0, duration: 0.55, ease: "power3.inOut" }, 4.4);
          tl.to("#s6-opt-2", { color: "#3d5686", duration: 0.3 }, 4.5);
          tl.to("#s6-opt-1", { color: "#ffffff", duration: 0.3 }, 4.6);
          tl.fromTo("#s6-a-p", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.2);
          tl.to("#s6-a", { opacity: 0, y: -60, duration: 0.5, ease: "power2.in" }, 6.0);

          // phase B: the week fills in
          tl.fromTo("#s6-b", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.4);
          tl.fromTo("#s6-b-h", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power4.out" }, 6.5);
          tl.fromTo("#s6-week", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 6.8);
          gsap.utils.toArray("#s6-root .s6-dn").forEach(function (d, i) {
            tl.fromTo(d, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.2 + i * 0.08);
          });
          gsap.utils.toArray("#s6-root .s6-chip").forEach(function (c, i) {
            tl.fromTo(c, { opacity: 0, scale: 0.5, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, 8.2 + i * 0.45);
          });
          tl.to("#s6-week", { scale: 1.02, duration: 4, ease: "sine.inOut" }, 11.8);

          tl.to("#s6-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 16.0);

          window.__timelines["s6-flex"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
