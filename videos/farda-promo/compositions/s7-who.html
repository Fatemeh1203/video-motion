<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s7-who-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s7-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--on-night);
          background: linear-gradient(135deg, var(--night) 0%, var(--night-2) 55%, #2a4d8f 100%);
        }
        #s7-wrap {
          position: absolute;
          inset: 0;
        }
        #s7-glow {
          position: absolute;
          left: 460px;
          top: -200px;
          width: 1000px;
          height: 1000px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(91, 141, 239, 0.35), rgba(91, 141, 239, 0) 65%);
        }
        #s7-line {
          position: absolute;
          left: 0;
          right: 0;
          top: 300px;
          height: 380px;
          display: flex;
          flex-direction: column;
          align-items: center;
          direction: rtl;
          font-weight: 900;
          line-height: 1.3;
        }
        #s7-pre {
          font-size: 76px;
          color: var(--on-night-soft);
          opacity: 0;
          white-space: nowrap;
        }
        #s7-slot {
          position: relative;
          width: 1400px;
          height: 230px;
          overflow: hidden;
          font-size: 150px;
        }
        .s7-item {
          position: absolute;
          right: 0;
          left: 0;
          text-align: center;
          top: 6px;
          white-space: nowrap;
          color: var(--sun-soft);
          opacity: 0;
        }
        #s7-under {
          position: absolute;
          left: 560px;
          bottom: 8px;
          width: 280px;
          height: 10px;
          border-radius: 5px;
          background: var(--dot);
          transform-origin: center center;
        }
        #s7-badges {
          position: absolute;
          left: 170px;
          right: 170px;
          top: 640px;
          display: flex;
          direction: rtl;
          justify-content: space-between;
        }
        .s7-badge {
          width: 490px;
          padding: 36px 30px;
          border-radius: 32px;
          background: rgba(255, 255, 255, 0.08);
          border: 2px solid rgba(185, 205, 242, 0.28);
          display: flex;
          align-items: center;
          gap: 26px;
          opacity: 0;
        }
        .s7-check {
          flex: none;
          width: 84px;
          height: 84px;
          border-radius: 50%;
          background: var(--sun-soft);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .s7-check svg {
          width: 46px;
          height: 46px;
        }
        .s7-check path {
          fill: none;
          stroke: var(--night);
          stroke-width: 7;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .s7-bt b {
          display: block;
          font-size: 40px;
          font-weight: 900;
          color: #fff;
          line-height: 1.35;
          white-space: nowrap;
        }
        .s7-bt small {
          display: block;
          font-size: 28px;
          font-weight: 500;
          color: var(--on-night-soft);
          white-space: nowrap;
          line-height: 1.5;
        }
      </style>

      <div id="s7-root" data-composition-id="s7-who" data-width="1920" data-height="1080" data-duration="14.6">
        <div id="s7-wrap">
          <div id="s7-glow"></div>

          <div id="s7-line">
            <span id="s7-pre">فردا برای</span>
            <div id="s7-slot">
              <span class="s7-item">دانش‌آموزان</span>
              <span class="s7-item">دانشجویان</span>
              <span class="s7-item">معلم‌ها</span>
              <span class="s7-item">مدارس همکار</span>
              <span class="s7-item">همهٔ کنجکاوها</span>
              <div id="s7-under"></div>
            </div>
          </div>

          <div id="s7-badges">
            <div class="s7-badge">
              <div class="s7-check"><svg viewBox="0 0 46 46"><path d="M9 24 L19 34 L37 13" /></svg></div>
              <div class="s7-bt"><b>مدرسین متخصص</b><small>همراه شما در هر قدم</small></div>
            </div>
            <div class="s7-badge">
              <div class="s7-check"><svg viewBox="0 0 46 46"><path d="M9 24 L19 34 L37 13" /></svg></div>
              <div class="s7-bt"><b>آموزش کاربردی</b><small>یادگیری با تجربه و پروژه</small></div>
            </div>
            <div class="s7-badge">
              <div class="s7-check"><svg viewBox="0 0 46 46"><path d="M9 24 L19 34 L37 13" /></svg></div>
              <div class="s7-bt"><b>پیگیری منظم</b><small>برنامهٔ هفتگی برای هر فراگیر</small></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const D = 14.6;

          tl.fromTo("#s7-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s7-glow", { scale: 0.8, x: -120 }, { scale: 1.15, x: 120, duration: D, ease: "sine.inOut" }, 0);

          tl.fromTo("#s7-pre", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.5);
          tl.fromTo("#s7-under", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.8);

          // slot-machine audience roll
          const items = gsap.utils.toArray("#s7-root .s7-item");
          items.forEach(function (it, i) {
            const at = 0.9 + i * 1.5;
            tl.fromTo(it, { opacity: 0, yPercent: 100 }, { opacity: 1, yPercent: 0, duration: 0.4, ease: "power3.out" }, at);
            if (i < items.length - 1) {
              tl.to(it, { opacity: 0, yPercent: -100, duration: 0.35, ease: "power3.in" }, at + 1.15);
            }
          });
          // last item lands with a punch (≈ 8.1s → root 100.1s)
          tl.fromTo("#s7-slot", { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 7.0);

          gsap.utils.toArray("#s7-root .s7-badge").forEach(function (b, i) {
            const at = 8.7 + i * 0.35;
            tl.fromTo(b, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" }, at);
            tl.fromTo(b.querySelector(".s7-check"), { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.6)" }, at + 0.2);
            const p = b.querySelector("path");
            tl.fromTo(p, { strokeDasharray: 48, strokeDashoffset: 48 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, at + 0.4);
          });
          tl.to("#s7-line", { y: -170, scale: 0.86, duration: 0.8, ease: "power3.inOut" }, 8.2);
          tl.to("#s7-badges", { y: -10, duration: 3.5, ease: "sine.inOut" }, 10.4);

          tl.to("#s7-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 14.0);

          window.__timelines["s7-who"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
