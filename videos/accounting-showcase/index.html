        --glass-line: rgba(29, 42, 68, 0.12);

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:

          var(--bg);
        font-family: "Vazirmatn", sans-serif;
        color: var(--fg);
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: url("assets/grain.png");
        background-size: 256px 256px;
        opacity: 0.05;
        mix-blend-mode: overlay;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(29, 42, 68, 0) 60%, rgba(29, 42, 68, 0.12) 100%);
