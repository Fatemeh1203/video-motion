<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s2-overview-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #ov-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #ov-wrap {
          position: absolute;
          inset: 0;
        }
        #ov-head {
          position: absolute;
          top: 60px;
          left: 0;
          right: 0;
          text-align: center;
          direction: rtl;
          font-size: 78px;
          font-weight: 900;
          opacity: 0;
        }
        #ov-head span {
          background: linear-gradient(100deg, #2563eb, #0f9d7a 80%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .ov-card {
          position: absolute;
          width: 330px;
          border-radius: 26px;
          border: 2px solid var(--glass-line);
          background: var(--glass);
          box-shadow: 0 16px 40px rgba(29, 42, 68, 0.1);
          direction: rtl;
          text-align: center;
          padding: 22px 20px;
          opacity: 0;
        }
        .ov-card b {
          display: block;
          font-size: 40px;
          font-weight: 900;
          color: var(--c);
        }
        .ov-card small {
          display: block;
          margin-top: 6px;
          font-size: 26px;
          font-weight: 500;
          color: var(--muted);
          line-height: 1.5;
        }
        .ov-card.big {
          padding: 40px 20px;
        }
        .ov-card.big b {
          font-size: 64px;
        }
        .ov-arrow {
          position: absolute;
          height: 6px;
          width: 70px;
          border-radius: 3px;
          background: linear-gradient(270deg, rgba(15, 157, 122, 0.25), #0f9d7a);
          transform-origin: right center;
        }
        .ov-arrow::after {
          content: "";
          position: absolute;
          left: -6px;
          top: -9px;
          border-style: solid;
          border-width: 12px 16px 12px 0;
          border-color: transparent #0f9d7a transparent transparent;
        }
        .ov-dot {
          position: absolute;
          width: 22px;
          height: 22px;
          margin: -11px 0 0 -11px;
          left: 1460px;
          top: 550px;
          border-radius: 50%;
          background: #2563eb;
          box-shadow: 0 0 18px rgba(37, 99, 235, 0.7);
          opacity: 0;
        }
        #ov-foot {
          position: absolute;
          top: 950px;
          left: 0;
          right: 0;
          text-align: center;
          direction: rtl;
          font-size: 32px;
          font-weight: 700;
          color: var(--mint);
          opacity: 0;
        }
      </style>

      <div id="ov-root" data-composition-id="s2-overview" data-width="1920" data-height="1080" data-duration="6.2">
        <div id="ov-wrap">
          <div id="ov-head">کل سیستم <span>در یک نگاه</span></div>

          <!-- inputs (right) -->
          <div class="ov-card" id="ov-staff" style="left: 1460px; top: 300px; --c: #2563eb"><b>همکاران</b><small>۳ فرم: واریزی،<br />هزینه، کلاس‌ها</small></div>
          <div class="ov-card" id="ov-admin" style="left: 1460px; top: 580px; --c: #6b4fe0"><b>مدیر</b><small>پنل خصوصی<br />قفل با رمز</small></div>
          <!-- engine -->
          <div class="ov-card big" id="ov-n8n" style="left: 1020px; top: 400px; --c: #dc4a3d"><b>n8n</b><small>۹ ورک‌فلو<br />روی سرور آموزشگاه</small></div>
          <!-- ledger -->
          <div class="ov-card big" id="ov-sheet" style="left: 580px; top: 400px; --c: #0f9d7a"><b>گوگل‌شیت</b><small>دفتر کل<br />۱۷ شیت فارسی</small></div>
          <!-- outputs (left) -->
          <div class="ov-card" id="ov-o1" style="left: 140px; top: 250px; --c: #2563eb"><b>تلگرام</b><small>تأیید یا رد مدیر</small></div>
          <div class="ov-card" id="ov-o2" style="left: 140px; top: 460px; --c: #d97706"><b>ایمیل</b><small>گزارش + پیوست اکسل</small></div>
          <div class="ov-card" id="ov-o3" style="left: 140px; top: 670px; --c: #0f9d7a"><b>گوگل‌درایو</b><small>عکس فیش و فاکتور</small></div>

          <div class="ov-arrow" id="ov-a1" style="left: 1375px; top: 547px"></div>
          <div class="ov-arrow" id="ov-a2" style="left: 935px; top: 547px"></div>
          <div class="ov-arrow" id="ov-a3" style="left: 495px; top: 547px"></div>
          <div class="ov-dot" id="ov-dot"></div>

          <div id="ov-foot">تقویم شمسی · منطقهٔ زمانی تهران · هر ورودی در «لاگ ورودی» بایگانی می‌شود</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#ov-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#ov-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          const pop = { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.7)" };
          const from = { opacity: 0, y: 30, scale: 0.9 };
          tl.fromTo("#ov-staff", from, pop, 0.5);
          tl.fromTo("#ov-admin", from, pop, 0.7);
          tl.fromTo("#ov-a1", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.1);
          tl.fromTo("#ov-n8n", from, pop, 1.3);
          tl.fromTo("#ov-a2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.8);
          tl.fromTo("#ov-sheet", from, pop, 2.0);
          tl.fromTo("#ov-a3", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 2.5);
          tl.fromTo(["#ov-o1", "#ov-o2", "#ov-o3"], from, Object.assign({ stagger: 0.15 }, pop), 2.7);
          // a record travels through the whole system
          tl.fromTo("#ov-dot", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 3.4);
          tl.fromTo("#ov-dot", { x: 0 }, { x: -990, duration: 1.4, ease: "power1.inOut", immediateRender: false }, 3.5);
          tl.to("#ov-dot", { opacity: 0, duration: 0.2 }, 4.85);
          tl.fromTo("#ov-foot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 3.6);
          tl.to("#ov-wrap", { opacity: 0, duration: 0.4, ease: "power1.in" }, 5.8);
          window.__timelines["s2-overview"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
