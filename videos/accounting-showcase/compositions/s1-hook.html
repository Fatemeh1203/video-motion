<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s1-hook-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s1-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #s1-wrap {
          position: absolute;
          inset: 0;
        }
        #s1-glow {
          position: absolute;
          left: 460px;
          top: 190px;
          width: 1000px;
          height: 700px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(37, 99, 235, 0.1), rgba(37, 99, 235, 0) 70%);
        }
        .s1-line {
          position: absolute;
          left: 120px;
          right: 120px;
          text-align: center;
          direction: rtl;
          opacity: 0;
        }
        #s1-l1 {
          top: 250px;
          font-size: 96px;
          font-weight: 900;
          line-height: 1.35;
        }
        #s1-l1 span,
        #s1-l3 span {
          background: linear-gradient(100deg, #2563eb, #0f9d7a 80%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        #s1-pills {
          position: absolute;
          top: 520px;
          left: 0;
          right: 0;
          display: flex;
          flex-direction: row-reverse;
          justify-content: center;
          gap: 28px;
        }
        .s1-pill {
          padding: 16px 38px;
          border-radius: 50px;
          background: #ffffff;
          border: 2px solid var(--c);
          box-shadow: 0 10px 26px rgba(29, 42, 68, 0.1);
          direction: rtl;
          font-size: 44px;
          font-weight: 800;
          color: var(--c);
          opacity: 0;
        }
        #s1-l3 {
          top: 330px;
          font-size: 150px;
          font-weight: 900;
          line-height: 1.3;
        }
        #s1-l3 small {
          display: block;
          font-size: 50px;
          font-weight: 700;
          color: var(--muted);
        }
      </style>

      <div id="s1-root" data-composition-id="s1-hook" data-width="1920" data-height="1080" data-duration="4.5833">
        <div id="s1-wrap">
          <div id="s1-glow"></div>
          <div class="s1-line" id="s1-l1">آموزشگاه ما <span>یک حسابدار تازه</span> دارد</div>
          <div id="s1-pills">
            <div class="s1-pill" style="--c: #0f9d7a">حقوق نمی‌گیرد</div>
            <div class="s1-pill" style="--c: #2563eb">مرخصی نمی‌رود</div>
            <div class="s1-pill" style="--c: #d97706">۲۴ ساعته سر کار است</div>
          </div>
          <div class="s1-line" id="s1-l3"><small>اسمش…</small><span>n8n</span></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline();
          tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
          tl.fromTo("#s1-glow", { scale: 0.7 }, { scale: 1.2, duration: 5.5, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-l1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.15);
          tl.fromTo("#s1-root .s1-pill", { opacity: 0, y: 40, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.4 }, 1.9);
          tl.to(["#s1-l1", "#s1-pills"], { opacity: 0, y: -40, duration: 0.35, ease: "power2.in" }, 3.45);
          tl.fromTo("#s1-l3", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power4.out" }, 3.75);
          tl.to("#s1-wrap", { opacity: 0, duration: 0.4, ease: "power1.in" }, 5.1);
          // play the scene 1.2x faster
          const root = gsap.timeline({ paused: true });
          root.add(tl.timeScale(1.2), 0);
          window.__timelines["s1-hook"] = root;
        })();
      </script>
    </template>
  </body>
</html>
