<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-outro-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
        }
        #s6-wrap {
          position: absolute;
          inset: 0;
        }
        #s6-glow {
          position: absolute;
          left: 460px;
          top: 140px;
          width: 1000px;
          height: 800px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(15, 157, 122, 0.12), rgba(15, 157, 122, 0) 70%);
        }
        .s6-line {
          position: absolute;
          left: 120px;
          right: 120px;
          text-align: center;
          direction: rtl;
          opacity: 0;
        }
        #s6-rule {
          position: absolute;
          top: 545px;
          left: 760px;
          width: 400px;
          height: 3px;
          background: linear-gradient(90deg, rgba(37, 99, 235, 0), #2563eb, #0f9d7a, rgba(15, 157, 122, 0));
        }
        #s6-name {
          top: 360px;
          font-size: 120px;
          font-weight: 900;
        }
        #s6-role {
          top: 590px;
          font-size: 64px;
          font-weight: 500;
          color: var(--mint);
        }
      </style>

      <div id="s6-root" data-composition-id="s6-outro" data-width="1920" data-height="1080" data-duration="4.6">
        <div id="s6-wrap">
          <div id="s6-glow"></div>
                    <div id="s6-rule"></div>
          <div class="s6-line" id="s6-name">فاطمه شمس</div>
          <div class="s6-line" id="s6-role">آموزشگاه فردا</div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-wrap", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);
          tl.fromTo("#s6-glow", { scale: 0.8 }, { scale: 1.15, duration: 4.6, ease: "sine.inOut" }, 0);
          tl.fromTo("#s6-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
          tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.9);
          tl.fromTo("#s6-role", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.1);
          tl.to("#s6-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 3.95);
          window.__timelines["s6-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
