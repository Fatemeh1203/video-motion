<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s5-request-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s5-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
          background: var(--bg);
        }
        #s5-wrap {
          position: absolute;
          inset: 0;
        }
        #s5-glow {
          position: absolute;
          width: 1300px;
          height: 1300px;
          left: -200px;
          top: -150px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(253, 185, 155, 0.2), rgba(253, 185, 155, 0) 62%);
        }
        #s5-copy {
          position: absolute;
          right: 140px;
          top: 250px;
          width: 700px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        #s5-copy > * {
          opacity: 0;
        }
        #s5-eyebrow {
          font-size: 36px;
          font-weight: 500;
          color: var(--gold);
        }
        #s5-title {
          font-size: 104px;
          font-weight: 900;
          line-height: 1.25;
        }
        #s5-sub {
          font-size: 38px;
          font-weight: 400;
          line-height: 1.65;
          color: var(--muted);
        }
        #s5-form {
          position: absolute;
          left: 150px;
          top: 100px;
          width: 860px;
          height: 880px;
          border-radius: 32px;
          background: var(--panel);
          border: 3px solid var(--line);
          box-shadow: 0 40px 120px rgba(5, 6, 18, 0.6);
          padding: 54px 60px;
          direction: rtl;
          opacity: 0;
        }
        #s5-form h4 {
          font-size: 44px;
          font-weight: 800;
          margin-bottom: 30px;
        }
        .s5-label {
          font-size: 28px;
          font-weight: 500;
          color: var(--muted);
          margin-bottom: 12px;
        }
        .s5-field {
          position: relative;
          border-radius: 16px;
          border: 3px solid #3a4180;
          background: #151938;
          padding: 16px 24px;
          font-size: 34px;
          font-weight: 500;
          line-height: 1.55;
          margin-bottom: 30px;
          min-height: 76px;
        }
        #s5-f2 {
          height: 176px;
        }
        .s5-caret {
          display: inline-block;
          width: 4px;
          height: 40px;
          margin-right: 4px;
          vertical-align: -8px;
          background: var(--gold);
          opacity: 0;
        }
        #s5-radios {
          display: flex;
          gap: 18px;
          margin-bottom: 40px;
        }
        .s5-radio {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 14px 22px;
          border-radius: 16px;
          border: 3px solid #3a4180;
          font-size: 26px;
          font-weight: 500;
          white-space: nowrap;
        }
        .s5-radio b {
          position: relative;
          display: block;
          width: 30px;
          height: 30px;
          border-radius: 50%;
          border: 3px solid var(--muted);
        }
        #s5-dot {
          position: absolute;
          left: 5px;
          top: 5px;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: var(--gold);
        }
        #s5-btn {
          display: inline-flex;
          align-items: center;
          gap: 14px;
          padding: 20px 44px;
          border-radius: 18px;
          background: var(--gold);
          color: #241a08;
          font-size: 34px;
          font-weight: 800;
        }
        #s5-toast {
          position: absolute;
          right: 140px;
          top: 880px;
          width: 700px;
          padding: 26px 34px;
          border-radius: 20px;
          background: #1f5a45;
          border: 3px solid #5fd3a1;
          direction: rtl;
          display: flex;
          align-items: center;
          gap: 20px;
          font-size: 32px;
          font-weight: 700;
          opacity: 0;
        }
        #s5-toast i {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 50px;
          height: 50px;
          border-radius: 50%;
          background: #5fd3a1;
          flex: none;
        }
      </style>

      <div id="s5-root" data-composition-id="s5-request" data-width="1920" data-height="1080" data-duration="10.6">
        <div id="s5-wrap">
          <div id="s5-glow"></div>
          <div id="s5-copy">
            <div id="s5-eyebrow">ثبت پروژه</div>
            <div id="s5-title">ایده‌ای در سر داری؟</div>
            <div id="s5-sub">مختصری از پروژه‌ای که مدنظرت است بنویس تا بررسی کنم و با تو تماس بگیرم.</div>
          </div>

          <div id="s5-form">
            <h4>فرم ثبت پروژه</h4>
            <div class="s5-label">عنوان شغل</div>
            <div class="s5-field" id="s5-f1"><span id="s5-t1"></span><span class="s5-caret" id="s5-c1"></span></div>
            <div class="s5-label">چه چالشی توی این شغل داری؟</div>
            <div class="s5-field" id="s5-f2"><span id="s5-t2"></span><span class="s5-caret" id="s5-c2"></span></div>
            <div class="s5-label">برای راه‌حل چه چیزی را ترجیح می‌دهی؟</div>
            <div id="s5-radios">
              <div class="s5-radio"><b></b><span>خودم پیشنهاد دارم</span></div>
              <div class="s5-radio" id="s5-r2"><b><span id="s5-dot"></span></b><span>شما بررسی کنید و پیشنهاد بدهید</span></div>
            </div>
            <div id="s5-btn"><span>ارسال درخواست</span></div>
          </div>

          <div id="s5-toast">
            <i><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#11142a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13.5 L11 19 L21 7" /></svg></i>
            <span>درخواست ثبت شد — به‌زودی بررسی و پاسخ داده می‌شود.</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s5-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s5-glow", { scale: 0.9 }, { scale: 1.1, duration: 10.6, ease: "sine.inOut" }, 0);

          gsap.utils.toArray("#s5-copy > *").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, x: 50 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.4 + i * 0.3);
          });
          tl.fromTo("#s5-form", { opacity: 0, y: 80, rotation: -2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "back.out(1.3)" }, 0.8);

          // prompt typing via discrete text states (seek-safe: text is a pure function of tl.time())
          function typeInto(sel, text, start, dur) {
            const el = document.querySelector(sel);
            const chars = Array.from(text);
            const state = { n: 0 };
            tl.fromTo(
              state,
              { n: 0 },
              {
                n: chars.length,
                duration: dur,
                ease: "none",
                onUpdate: function () {
                  el.textContent = chars.slice(0, Math.round(state.n)).join("");
                },
              },
              start,
            );
          }
          // blinking carets (finite repeats)
          tl.set("#s5-c1", { opacity: 1 }, 2.0);
          typeInto("#s5-t1", "معلم", 2.2, 0.5);
          tl.set("#s5-c1", { opacity: 0 }, 2.95);
          tl.set("#s5-c2", { opacity: 1 }, 3.0);
          typeInto("#s5-t2", "ساختن تمرین و آزمون برای هر کلاس خیلی وقت‌گیر است…", 3.1, 3.1);
          tl.fromTo("#s5-c2", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 3, immediateRender: false }, 6.3);
          tl.set("#s5-c2", { opacity: 0 }, 7.3);

          // pick the "you review it" option
          tl.fromTo("#s5-r2", { borderColor: "#3a4180" }, { borderColor: "#e5b055", duration: 0.3, ease: "power1.out" }, 6.6);
          tl.fromTo("#s5-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 6.6);

          // press-release-spring on submit
          tl.fromTo("#s5-btn", { scale: 1 }, { scale: 0.92, duration: 0.1, ease: "power2.in" }, 7.4);
          tl.to("#s5-btn", { scale: 1, duration: 0.5, ease: "elastic.out(1.1, 0.45)" }, 7.5);
          tl.fromTo("#s5-toast", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 7.8);
          tl.fromTo("#s5-toast i", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, 7.95);

          tl.to("#s5-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 10.0);

          window.__timelines["s5-request"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
