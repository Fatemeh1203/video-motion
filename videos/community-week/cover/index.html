<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #080b15; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Vazirmatn", sans-serif; color: #eff4ff; background: radial-gradient(ellipse 95% 60% at 50% 45%, #141c3a 0%, #0b1122 45%, #080b15 80%); }
      .rtl { direction: rtl; }
      .g { background: linear-gradient(100deg, #ae9cff, #a8ffef 78%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .orb { position: absolute; border-radius: 50%; filter: blur(130px); }
      #orb1 { width: 680px; height: 680px; left: -200px; top: 380px; background: #ae9cff; opacity: 0.34; }
      #orb2 { width: 640px; height: 640px; left: 640px; top: 980px; background: #3fd8c6; opacity: 0.24; }
      .pt { position: absolute; border-radius: 50%; background: #dfe8ff; }

      /* week strip, every day done: the whole week */
      #week { position: absolute; left: 90px; width: 900px; top: 380px; height: 124px; display: flex; justify-content: space-between; direction: rtl; }
      .pill { position: relative; width: 116px; height: 124px; border-radius: 34px; display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; color: #0b1122; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); }
      .pill .dot { position: absolute; left: 50%; bottom: 12px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #ffbf86; box-shadow: 0 0 0 3px rgba(11, 17, 34, 0.55); }

      #h1 { position: absolute; left: 60px; right: 60px; top: 580px; text-align: center; font-size: 230px; font-weight: 900; line-height: 1.15; }
      #h2 { position: absolute; left: 60px; right: 60px; top: 870px; text-align: center; font-size: 104px; font-weight: 900; line-height: 1.3; }
      #tags { position: absolute; left: 110px; right: 110px; top: 1180px; display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 18px; direction: rtl; }
      #tags span { padding: 10px 32px 14px; border-radius: 40px; border: 3px solid var(--c); color: var(--c); background: rgba(8, 11, 21, 0.55); font-size: 42px; font-weight: 800; }
      #by { position: absolute; left: 90px; right: 90px; top: 1440px; text-align: center; font-size: 48px; font-weight: 700; color: #b3bdd8; }
      #grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 256px 256px; opacity: 0.07; mix-blend-mode: overlay; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 50% 50%, rgba(8, 11, 21, 0) 55%, rgba(3, 5, 11, 0.6) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
      <div id="orb1" class="orb" data-layout-allow-overflow></div>
      <div id="orb2" class="orb" data-layout-allow-overflow></div>
      <div id="stars"></div>
      <div id="week"></div>
      <div id="h1" class="rtl"><span class="g">یک هفته</span></div>
      <div id="h2" class="rtl"><div>در کامیونیتی</div><div>هوش مصنوعی</div></div>
      <div id="tags">
        <span style="--c: #91ffea">درس روزانه</span>
        <span style="--c: #ffbf86">خبر هوش مصنوعی</span>
        <span style="--c: #b39aff">جزوه</span>
        <span style="--c: #77caff">شبیه‌ساز</span>
        <span style="--c: #ddf998">پرسش و پاسخ</span>
      </div>
      <div id="by" class="rtl">با فاطمه شمس</div>
      <div id="vignette"></div>
      <div id="grain" class="clip" data-start="0" data-duration="1" data-track-index="5"></div>
    </div>
    <script>
      (function () {
        let seed = 11;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        const stars = document.getElementById("stars");
        for (let i = 0; i < 46; i++) {
          const d = document.createElement("i");
          d.className = "pt";
          const s = 2 + rnd() * 4;
          d.style.cssText = "left:" + (rnd() * 1080).toFixed(1) + "px;top:" + (rnd() * 1920).toFixed(1) + "px;width:" + s.toFixed(1) + "px;height:" + s.toFixed(1) + "px;opacity:" + (0.12 + rnd() * 0.35).toFixed(2);
          stars.appendChild(d);
        }
        // seven days, the gradient runs violet -> mint across the week
        const DAYS = [["ش", 0], ["ی", 1], ["د", 0], ["س", 1], ["چ", 0], ["پ", 1], ["ج", 0]];
        const A = [174, 156, 255], B = [137, 255, 240];
        const mix = (k) => "rgb(" + A.map((a, j) => Math.round(a + (B[j] - a) * k)).join(",") + ")";
        const week = document.getElementById("week");
        DAYS.forEach(function (d, i) {
          const p = document.createElement("div");
          p.className = "pill";
          p.style.background = "linear-gradient(140deg, " + mix(i / 7) + ", " + mix((i + 1) / 7) + ")";
          p.innerHTML = "<b>" + d[0] + "</b>" + (d[1] ? '<span class="dot"></span>' : "");
          week.appendChild(p);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = gsap.timeline({ paused: true }).to({}, { duration: 1 });
      })();
    </script>
  </body>
</html>
