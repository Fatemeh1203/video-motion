<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s3-portals-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s3-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
          background: var(--bg);
        }
        #s3-wrap {
          position: absolute;
          inset: 0;
        }
        .s3-glow {
          position: absolute;
          border-radius: 50%;
        }
        #s3-glow-a {
          width: 1400px;
          height: 1400px;
          left: -380px;
          top: -300px;
          background: radial-gradient(circle, rgba(174, 156, 255, 0.24), rgba(174, 156, 255, 0) 62%);
        }
        #s3-glow-b {
          width: 1100px;
          height: 1100px;
          right: -300px;
          bottom: -520px;
          background: radial-gradient(circle, rgba(137, 255, 240, 0.16), rgba(137, 255, 240, 0) 62%);
        }
        #s3-stage {
          position: absolute;
          left: 90px;
          top: 150px;
          width: 1150px;
          height: 780px;
          perspective: 2400px;
        }
        #s3-win {
          position: absolute;
          inset: 0;
          border-radius: 26px;
          overflow: hidden;
          border: 2px solid var(--glass-line);
          background: #05070f;
          box-shadow: 0 40px 140px rgba(0, 0, 0, 0.7), 0 0 80px rgba(174, 156, 255, 0.18);
          opacity: 0;
        }
        #s3-bar {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 56px;
          display: flex;
          align-items: center;
          gap: 11px;
          padding: 0 24px;
          background: rgba(23, 29, 48, 0.96);
          border-bottom: 2px solid var(--glass-line);
          direction: ltr;
        }
        #s3-bar i {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #3a4566;
        }
        #s3-url {
          margin-left: 26px;
          flex: 1;
          height: 34px;
          border-radius: 17px;
          background: #0b1122;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 20px;
          font-weight: 500;
          letter-spacing: 3px;
          color: var(--muted);
        }
        #s3-video {
          position: absolute;
          left: 0;
          top: 56px;
          width: 1150px;
          height: 724px;
          object-fit: cover;
          object-position: 50% 45%;
        }
        #s3-copy {
          position: absolute;
          right: 130px;
          top: 150px;
          width: 560px;
          direction: rtl;
        }
        #s3-eyebrow {
          font-size: 32px;
          font-weight: 500;
          color: var(--mint);
          margin-bottom: 12px;
          opacity: 0;
        }
        #s3-title {
          font-size: 92px;
          font-weight: 900;
          line-height: 1.25;
          opacity: 0;
        }
        #s3-list {
          margin-top: 34px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .s3-item {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 12px 22px;
          border-radius: 18px;
          border: 2px solid var(--glass-line);
          background: rgba(23, 29, 48, 0.72);
          opacity: 0;
        }
        .s3-item i {
          display: block;
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: var(--c);
          box-shadow: 0 0 18px var(--c);
          flex: none;
        }
        .s3-item b {
          font-size: 38px;
          font-weight: 800;
        }
        .s3-item small {
          margin-right: auto;
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 3px;
          color: var(--c);
          direction: ltr;
        }
      </style>

      <div id="s3-root" data-composition-id="s3-portals" data-width="1920" data-height="1080" data-duration="14.6">
        <div id="s3-wrap">
          <div class="s3-glow" id="s3-glow-a"></div>
          <div class="s3-glow" id="s3-glow-b"></div>

          <div id="s3-stage">
            <div id="s3-win">
              <div id="s3-bar">
                <i></i><i></i><i></i>
                <div id="s3-url">THE INTELLIGENCE SPACE</div>
              </div>
              <video id="s3-video" class="clip" src="assets/clips/home-ring.mp4" data-start="0" data-duration="14.6" data-playback-rate="0.95" data-track-index="0" muted playsinline></video>
            </div>
          </div>

          <div id="s3-copy">
            <div id="s3-eyebrow">سایت، در شکل تازه</div>
            <div id="s3-title">شش دروازه، شش جهان</div>
            <div id="s3-list">
              <div class="s3-item" style="--c: #91ffea"><i></i><b>درباره من</b><small>THE ORIGIN</small></div>
              <div class="s3-item" style="--c: #b39aff"><i></i><b>نمونه‌کارها</b><small>THE ARCHIVE</small></div>
              <div class="s3-item" style="--c: #77caff"><i></i><b>ایجنت‌ها</b><small>AGENT DISTRICT</small></div>
              <div class="s3-item" style="--c: #ffbf86"><i></i><b>شبیه‌سازها</b><small>SIMULATION LAB</small></div>
              <div class="s3-item" style="--c: #ff94ba"><i></i><b>فایل‌ها</b><small>SUPPLY DEPOT</small></div>
              <div class="s3-item" style="--c: #ddf998"><i></i><b>انجمن</b><small>COLLECTIVE SPACE</small></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s3-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s3-glow-a", { scale: 0.9 }, { scale: 1.12, duration: 14.6, ease: "sine.inOut" }, 0);

          // device-surface-showcase: the live home page in a floating window
          tl.fromTo(
            "#s3-win",
            { opacity: 0, rotationY: 20, rotationX: 5, y: 90, scale: 0.9 },
            { opacity: 1, rotationY: 7, rotationX: 2, y: 0, scale: 1, duration: 1.3, ease: "power3.out" },
            0.3,
          );
          tl.to("#s3-win", { rotationY: 2, rotationX: 0, scale: 1.04, duration: 12.6, ease: "sine.inOut" }, 1.6);

          tl.fromTo("#s3-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.8);
          tl.set("#s3-title", { opacity: 1, y: 80 }, 1.1);
          tl.to("#s3-title", { y: 0, duration: 0.22, ease: "power4.out" }, 1.1);
          gsap.utils.toArray("#s3-root .s3-item").forEach(function (el, i) {
            const at = 2.3 + i * 0.3;
            tl.fromTo(el, { opacity: 0, x: 70 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, at);
            tl.fromTo(el.querySelector("i"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, at + 0.1);
          });
          // a soft highlight sweeps down the list, one gate after another
          gsap.utils.toArray("#s3-root .s3-item").forEach(function (el, i) {
            const at = 5.2 + i * 1.3;
            tl.to(el, { borderColor: "rgba(255,255,255,0.55)", x: -14, duration: 0.3, ease: "power2.out" }, at);
            tl.to(el, { borderColor: "rgba(255,255,255,0.14)", x: 0, duration: 0.4, ease: "power2.inOut" }, at + 1.1);
          });

          tl.to("#s3-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 14.0);

          window.__timelines["s3-portals"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
