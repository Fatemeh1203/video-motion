<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-community-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }


        #s6-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
          background: var(--bg);
        }
        #s6-wrap,
        .s6-phase {
          position: absolute;
          inset: 0;
        }
        .s6-phase {
          opacity: 0;
        }
        #s6-glow {
          position: absolute;
          width: 1400px;
          height: 1400px;
          left: -350px;
          top: -250px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(137, 255, 240, 0.14), rgba(137, 255, 240, 0) 62%);
        }
        #s6-glow2 {
          position: absolute;
          width: 1200px;
          height: 1200px;
          right: -350px;
          bottom: -550px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(174, 156, 255, 0.2), rgba(174, 156, 255, 0) 62%);
        }
        .s6-eyebrow {
          display: flex;
          align-items: center;
          gap: 16px;
          font-size: 36px;
          font-weight: 500;
          color: var(--p3);
        }
        .s6-plane {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: #2aa3de;
        }

        /* ---------- A: topics ---------- */
        #s6-a-copy {
          position: absolute;
          right: 140px;
          top: 270px;
          width: 820px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        #s6-a-copy > * {
          opacity: 0;
        }
        #s6-a-title {
          font-size: 104px;
          font-weight: 900;
          line-height: 1.25;
        }
        #s6-a-sub {
          font-size: 40px;
          font-weight: 400;
          line-height: 1.6;
          color: var(--muted);
        }
        #s6-panel {
          position: absolute;
          left: 170px;
          top: 90px;
          width: 700px;
          height: 900px;
          border-radius: 36px;
          background: rgba(18, 24, 42, 0.95);
          border: 3px solid rgba(255, 255, 255, 0.14);
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
          overflow: hidden;
          direction: rtl;
          opacity: 0;
        }
        #s6-panel-head {
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 30px 36px;
          background: #121a30;
          border-bottom: 2px solid rgba(255, 255, 255, 0.14);
        }
        #s6-avatar {
          width: 72px;
          height: 72px;
          border-radius: 50%;
          background: radial-gradient(circle at 50% 70%, #a8ffef, #89fff0 35%, #ae9cff 100%);
          flex: none;
        }
        #s6-panel-head b {
          display: block;
          font-size: 34px;
          font-weight: 800;
          direction: ltr;
          text-align: right;
        }
        #s6-panel-head span {
          font-size: 24px;
          color: var(--muted);
        }
        .s6-topic {
          position: relative;
          display: flex;
          align-items: center;
          gap: 22px;
          padding: 20px 36px;
          border-bottom: 2px solid rgba(255, 255, 255, 0.08);
          font-size: 34px;
          font-weight: 700;
          opacity: 0;
        }
        .s6-topic i {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 62px;
          height: 62px;
          border-radius: 50%;
          background: var(--c);
          flex: none;
          font-style: normal;
          font-size: 30px;
          font-weight: 900;
          color: #11142a;
        }
        #s6-t1-hl {
          position: absolute;
          inset: 0;
          background: rgba(137, 255, 240, 0.14);
          opacity: 0;
        }

        /* ---------- B: lesson post + count-up ---------- */
        #s6-post {
          position: absolute;
          right: 140px;
          top: 110px;
          width: 1020px;
          border-radius: 32px;
          background: linear-gradient(145deg, rgba(23, 29, 48, 0.97), rgba(9, 14, 26, 0.97));
          border: 2px solid rgba(255, 255, 255, 0.14);
          color: var(--fg);
          padding: 48px 56px 44px;
          direction: rtl;
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6);
          opacity: 0;
        }
        #s6-post-chip {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 8px 20px;
          border-radius: 30px;
          background: rgba(174, 156, 255, 0.18);
          color: #cdbfff;
          font-size: 26px;
          font-weight: 700;
        }
        #s6-post h5 {
          margin-top: 20px;
          font-size: 50px;
          font-weight: 900;
          line-height: 1.35;
        }
        #s6-post p {
          margin-top: 16px;
          font-size: 34px;
          font-weight: 500;
          line-height: 1.6;
          opacity: 0;
        }
        #s6-post .s6-k {
          margin-top: 26px;
          font-size: 30px;
          font-weight: 800;
          color: var(--p4);
          opacity: 0;
        }
        #s6-out {
          margin-top: 12px;
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.06);
          border: 2px solid rgba(137, 255, 240, 0.25);
          padding: 22px 28px;
          font-size: 34px;
          font-weight: 500;
          line-height: 1.6;
          min-height: 140px;
          font-style: italic;
          opacity: 0;
        }
        #s6-tags {
          margin-top: 22px;
          display: flex;
          flex-wrap: wrap;
          gap: 10px 22px;
          font-size: 28px;
          font-weight: 700;
          color: var(--p3);
          opacity: 0;
        }
        #s6-ring {
          position: absolute;
          left: 170px;
          top: 250px;
          width: 560px;
          height: 560px;
          opacity: 0;
        }
        #s6-ring svg {
          position: absolute;
          inset: 0;
          width: 560px;
          height: 560px;
          transform: rotate(-90deg);
        }
        #s6-ring-num {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          direction: rtl;
        }
        #s6-num {
          display: block;
          font-size: 150px;
          font-weight: 900;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          color: var(--mint);
        }
        #s6-ring-num span {
          margin-top: 16px;
          font-size: 32px;
          font-weight: 500;
          color: var(--muted);
          text-align: center;
          max-width: 360px;
          line-height: 1.5;
        }
        #s6-ring-cap {
          position: absolute;
          left: 170px;
          top: 850px;
          width: 560px;
          text-align: center;
          direction: rtl;
          font-size: 30px;
          color: var(--muted);
          opacity: 0;
        }

        /* ---------- C: kinetic beats ---------- */
        #s6-beats {
          position: absolute;
          left: 150px;
          right: 150px;
          top: 280px;
          display: flex;
          justify-content: center;
          gap: 70px;
          direction: rtl;
          white-space: nowrap;
        }
        .s6-beat {
          display: inline-block;
          font-size: 150px;
          font-weight: 900;
          line-height: 1.3;
          opacity: 0;
        }
        #s6-bt1 {
          color: var(--p1);
        }
        #s6-bt2 {
          color: var(--brand-2);
        }
        #s6-bt3 {
          color: var(--p6);
        }
        #s6-c-line {
          position: absolute;
          left: 150px;
          right: 150px;
          top: 560px;
          text-align: center;
          direction: rtl;
          font-size: 56px;
          font-weight: 700;
          opacity: 0;
        }
        #s6-c-rule {
          position: absolute;
          left: 810px;
          top: 680px;
          width: 300px;
          height: 6px;
          border-radius: 3px;
          background: var(--mint);
        }
      </style>

      <div id="s6-root" data-composition-id="s6-community" data-width="1920" data-height="1080" data-duration="22.6">
        <div id="s6-wrap">
          <div id="s6-glow"></div>
          <div id="s6-glow2"></div>

          <!-- A -->
          <div class="s6-phase" id="s6-a">
            <div id="s6-a-copy">
              <div class="s6-eyebrow">
                <span class="s6-plane"
                  ><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.6Z" /></svg
                ></span>
                <span>در تلگرام</span>
              </div>
              <div id="s6-a-title">کامیونیتی هوش مصنوعی</div>
              <div id="s6-a-sub">آموزش کاربردی هوش مصنوعی، تاپیک به تاپیک؛ از ابزارها و پرامپت‌ها تا شبیه‌سازها.</div>
            </div>

            <div id="s6-panel">
              <div id="s6-panel-head">
                <div id="s6-avatar"></div>
                <div>
                  <b>AI_Community</b>
                  <span>تاپیک‌ها</span>
                </div>
              </div>
              <div class="s6-topic" id="s6-t1" style="--c: #b39aff"><div id="s6-t1-hl"></div><i>۱</i><span>ابزار هوش مصنوعی</span></div>
              <div class="s6-topic" style="--c: #ffbf86"><i>۲</i><span>بانک پرامپت ویژهٔ معلم</span></div>
              <div class="s6-topic" style="--c: #77caff"><i>۳</i><span>نمونه‌کارها</span></div>
              <div class="s6-topic" style="--c: #ddf998"><i>۴</i><span>ایده</span></div>
              <div class="s6-topic" style="--c: #77caff"><i>۵</i><span>فایل‌ها</span></div>
              <div class="s6-topic" style="--c: #b39aff"><i>۶</i><span>پرسش و پاسخ</span></div>
              <div class="s6-topic" style="--c: #ffbf86"><i>۷</i><span>شبیه‌ساز</span></div>
            </div>
          </div>

          <!-- B -->
          <div class="s6-phase" id="s6-b">
            <div id="s6-ring">
              <svg viewBox="0 0 560 560">
                <circle cx="280" cy="280" r="240" fill="none" stroke="#1d2542" stroke-width="44" />
                <circle id="s6-arc" cx="280" cy="280" r="240" fill="none" stroke="#89fff0" stroke-width="44" stroke-linecap="round" stroke-dasharray="1508 1508" stroke-dashoffset="1508" />
              </svg>
              <div id="s6-ring-num">
                <b id="s6-num">۰٪</b>
                <span>سهم کیف‌های چرمی از درآمد کل</span>
              </div>
            </div>
            <div id="s6-ring-cap">نمونهٔ خروجی تمرین درس</div>

            <div id="s6-post">
              <div id="s6-post-chip">ابزار هوش مصنوعی</div>
              <h5>درس ۹ — تحلیل داده با آپلود فایل</h5>
              <p id="s6-p1">تصویر فاکتور خرید خودت را آپلود کن و بخواه آن را تحلیل کند.</p>
              <div class="s6-k" id="s6-k1">خروجی باید شبیه این باشد:</div>
              <div id="s6-out"><span id="s6-out-t"></span></div>
              <div id="s6-tags"><span>#هوش_مصنوعی</span><span>#آموزش_کاربردی</span><span>#آپلود_فایل</span><span>#تحلیل_داده</span></div>
            </div>
          </div>

          <!-- C -->
          <div class="s6-phase" id="s6-c">
            <div id="s6-beats">
              <span class="s6-beat" id="s6-bt1">بپرس.</span>
              <span class="s6-beat" id="s6-bt2">یاد بگیر.</span>
              <span class="s6-beat" id="s6-bt3">بساز.</span>
            </div>
            <div id="s6-c-line">کنار یک کامیونیتی فارسی‌زبان هوش مصنوعی</div>
            <div id="s6-c-rule"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const FA = "۰۱۲۳۴۵۶۷۸۹";
          function faNum(n) {
            return String(n).replace(/[0-9]/g, function (d) {
              return FA[+d];
            });
          }

          tl.fromTo("#s6-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s6-glow", { x: 0, y: 0 }, { x: 240, y: 120, duration: 22.6, ease: "sine.inOut" }, 0);
          tl.fromTo("#s6-glow2", { scale: 1 }, { scale: 1.2, duration: 22.6, ease: "sine.inOut" }, 0);

          // ---------------- A (0 – 7.1)
          tl.set("#s6-a", { opacity: 1 }, 0);
          gsap.utils.toArray("#s6-a-copy > *").forEach(function (el, i) {
            tl.fromTo(el, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.5 + i * 0.35);
          });
          tl.fromTo(".s6-plane", { rotation: -30, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.4)" }, 0.55);
          tl.fromTo("#s6-panel", { opacity: 0, y: 100, rotation: 2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.8, ease: "back.out(1.3)" }, 0.8);
          gsap.utils.toArray("#s6-root .s6-topic").forEach(function (el, i) {
            const at = 1.4 + i * 0.09;
            tl.fromTo(el, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
            tl.fromTo(el.querySelector("i"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, at + 0.1);
          });
          tl.fromTo("#s6-panel", { y: 0 }, { y: -16, duration: 3.6, ease: "sine.inOut", immediateRender: false }, 2.4);
          // tap the first topic → open the lesson
          tl.fromTo("#s6-t1-hl", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 6.0);
          tl.fromTo("#s6-t1", { scale: 1 }, { scale: 0.97, duration: 0.12, ease: "power1.in", yoyo: true, repeat: 1 }, 6.1);
          tl.to("#s6-a", { opacity: 0, scale: 0.97, duration: 0.5, ease: "power2.in" }, 6.7);

          // ---------------- B (7.1 – 16.4)
          tl.set("#s6-b", { opacity: 1 }, 7.1);
          tl.fromTo("#s6-post", { opacity: 0, y: 90, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.4)" }, 7.2);
          tl.fromTo("#s6-p1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.1);
          tl.fromTo("#s6-k1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 9.1);
          tl.fromTo("#s6-out", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 9.5);
          (function () {
            const text = Array.from("تحلیل فروش: بیشترین سهم فروش متعلق به کیف‌های چرمی با ۴۵ درصد درآمد کل است.");
            const el = document.querySelector("#s6-out-t");
            const st = { n: 0 };
            tl.fromTo(
              st,
              { n: 0 },
              {
                n: text.length,
                duration: 3.2,
                ease: "none",
                onUpdate: function () {
                  el.textContent = text.slice(0, Math.round(st.n)).join("");
                },
              },
              9.7,
            );
          })();
          tl.fromTo("#s6-tags", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 13.2);

          // stat ring: stat-bars-and-fills (arc) + counting-dynamic-scale
          tl.fromTo("#s6-ring", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 10.2);
          const CIRC = 1508;
          tl.fromTo("#s6-arc", { strokeDashoffset: CIRC }, { strokeDashoffset: CIRC * (1 - 0.45), duration: 2.4, ease: "power2.out" }, 10.8);
          const num = document.querySelector("#s6-num");
          const cnt = { v: 0 };
          tl.fromTo(
            cnt,
            { v: 0 },
            {
              v: 45,
              duration: 2.4,
              ease: "power2.out",
              onUpdate: function () {
                num.textContent = faNum(Math.round(cnt.v)) + "٪";
              },
            },
            10.8,
          );
          tl.fromTo("#s6-num", { scale: 0.7 }, { scale: 1, duration: 2.4, ease: "power2.out" }, 10.8);
          tl.fromTo("#s6-ring-cap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 12.0);
          tl.to("#s6-b", { opacity: 0, duration: 0.45, ease: "power2.in" }, 16.0);

          // ---------------- C (16.4 – 22.6): kinetic-beat-slam
          tl.set("#s6-c", { opacity: 1 }, 16.4);
          tl.set("#s6-bt1", { opacity: 1, scale: 2.2 }, 16.5);
          tl.to("#s6-bt1", { scale: 1, duration: 0.3, ease: "power4.out" }, 16.5);
          tl.set("#s6-bt2", { opacity: 1, x: -260 }, 17.3);
          tl.to("#s6-bt2", { x: 0, duration: 0.28, ease: "power4.out" }, 17.3);
          tl.set("#s6-bt3", { opacity: 1, y: 160, rotation: -8 }, 18.1);
          tl.to("#s6-bt3", { y: 0, rotation: 0, duration: 0.32, ease: "back.out(2)" }, 18.1);
          tl.fromTo("#s6-beats", { scale: 1 }, { scale: 1.04, duration: 4.0, ease: "sine.inOut" }, 18.6);
          tl.fromTo("#s6-c-line", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 19.2);
          tl.fromTo("#s6-c-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 19.6);

          tl.to("#s6-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 22.0);

          window.__timelines["s6-community"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
