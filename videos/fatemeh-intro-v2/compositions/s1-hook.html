<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s1-hook-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s1-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
          background: var(--bg);
        }
        #s1-wrap,
        #s1-cam {
          position: absolute;
          inset: 0;
        }
        #s1-video {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s1-shade {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(8, 11, 21, 0.88) 0%, rgba(8, 11, 21, 0.55) 30%, rgba(8, 11, 21, 0) 52%, rgba(8, 11, 21, 0.35) 100%);
        }
        #s1-copy {
          position: absolute;
          left: 160px;
          right: 160px;
          top: 96px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        #s1-eyebrow {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 10px 26px;
          border-radius: 40px;
          border: 2px solid rgba(137, 255, 240, 0.35);
          background: rgba(137, 255, 240, 0.08);
          font-size: 32px;
          font-weight: 500;
          color: var(--mint);
          opacity: 0;
        }
        #s1-eyebrow i {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: var(--mint);
          box-shadow: 0 0 16px var(--mint);
        }
        #s1-title {
          margin-top: 26px;
          display: flex;
          gap: 0 34px;
          font-size: 132px;
          font-weight: 900;
          line-height: 1.3;
        }
        .s1-w {
          display: inline-block;
          opacity: 0;
          background: linear-gradient(100deg, #ae9cff, #a8ffef 70%, #eff4ff);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        #s1-sub {
          margin-top: 14px;
          font-size: 42px;
          font-weight: 400;
          line-height: 1.6;
          color: var(--muted);
          opacity: 0;
        }
      </style>

      <div id="s1-root" data-composition-id="s1-hook" data-width="1920" data-height="1080" data-duration="12.5">
        <div id="s1-wrap">
          <div id="s1-cam">
            <video id="s1-video" class="clip" src="assets/clips/home-ring-clean.mp4" data-start="0" data-duration="12.5" data-playback-rate="0.8" data-track-index="0" muted playsinline></video>
          </div>
          <div id="s1-shade"></div>
          <div id="s1-copy">
            <div id="s1-eyebrow"><i></i><span>به جهان من خوش آمدی</span></div>
            <div id="s1-title">
              <span class="s1-w">ایده‌ها،</span>
              <span class="s1-w">اینجا</span>
              <span class="s1-w">جان&nbsp;می‌گیرند.</span>
            </div>
            <div id="s1-sub">مرز میان تخیل و هوش مصنوعی را رد کن؛ هر دروازه، شروع یک دنیای تازه است.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // slow camera push on the live portal ring
          tl.fromTo("#s1-cam", { scale: 1.12, y: 30 }, { scale: 1.0, y: 0, duration: 12.5, ease: "sine.out" }, 0);
          tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);

          tl.fromTo("#s1-eyebrow", { opacity: 0, y: -20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(2)" }, 1.0);
          tl.fromTo("#s1-eyebrow i", { scale: 1 }, { scale: 1.5, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.6);
          // waterfall-entry, word level
          let t = 1.5;
          gsap.utils.toArray("#s1-root .s1-w").forEach(function (w, i) {
            const heavy = i === 2;
            tl.set(w, { opacity: 1, y: heavy ? 90 : 60 }, t);
            tl.to(w, { y: 0, duration: heavy ? 0.22 : 0.17, ease: "power4.out" }, t);
            t += heavy ? 0.24 : 0.2;
          });
          tl.fromTo("#s1-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 3.2);
          tl.to("#s1-copy", { y: -16, duration: 7, ease: "sine.inOut" }, 4.5);
          tl.to("#s1-wrap", { opacity: 0, duration: 0.6, ease: "power1.in" }, 11.9);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
