<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s7-cta-template">
      <style>
        @font-face { font-family: "Vazirmatn"; font-weight: 300; src: url("assets/fonts/vazirmatn-arabic-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 400; src: url("assets/fonts/vazirmatn-arabic-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 500; src: url("assets/fonts/vazirmatn-arabic-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 700; src: url("assets/fonts/vazirmatn-arabic-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 800; src: url("assets/fonts/vazirmatn-arabic-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Vazirmatn"; font-weight: 900; src: url("assets/fonts/vazirmatn-arabic-900-normal.woff2") format("woff2"); }

        #s7-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Vazirmatn", sans-serif;
          color: var(--fg);
          background: var(--bg);
        }
        #s7-wrap,
        #s7-cam {
          position: absolute;
          inset: 0;
        }
        #s7-video {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        #s7-shade {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 70% 80% at 72% 40%, rgba(8, 11, 21, 0.9), rgba(8, 11, 21, 0.55) 70%, rgba(8, 11, 21, 0.35) 100%);
        }
        #s7-copy {
          position: absolute;
          right: 150px;
          top: 120px;
          width: 1080px;
          direction: rtl;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        #s7-eyebrow {
          display: flex;
          align-items: center;
          gap: 14px;
          font-size: 34px;
          font-weight: 500;
          color: var(--mint);
          opacity: 0;
        }
        #s7-eyebrow i {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: var(--mint);
          box-shadow: 0 0 16px var(--mint);
        }
        #s7-title {
          display: flex;
          flex-wrap: wrap;
          gap: 0 30px;
          font-size: 112px;
          font-weight: 900;
          line-height: 1.25;
        }
        .s7-w {
          display: inline-block;
          opacity: 0;
        }
        .s7-w.g {
          background: linear-gradient(100deg, #ae9cff, #a8ffef 80%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        #s7-sub {
          font-size: 40px;
          font-weight: 400;
          color: var(--muted);
          opacity: 0;
        }
        #s7-link {
          margin-top: 22px;
          display: flex;
          align-items: center;
          gap: 20px;
          padding: 18px 34px 18px 22px;
          border-radius: 50px;
          background: rgba(8, 11, 21, 0.85);
          border: 3px solid var(--mint);
          box-shadow: 0 0 40px rgba(137, 255, 240, 0.25);
          direction: ltr;
          font-size: 42px;
          font-weight: 700;
          color: var(--fg);
          opacity: 0;
        }
        .s7-plane {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 66px;
          height: 66px;
          border-radius: 50%;
          background: #2aa3de;
          flex: none;
        }
        #s7-qr {
          position: absolute;
          left: 170px;
          top: 150px;
          width: 440px;
          padding: 34px 34px 22px;
          border-radius: 32px;
          background: #eff4ff;
          box-shadow: 0 0 0 3px rgba(137, 255, 240, 0.6), 0 40px 120px rgba(0, 0, 0, 0.6);
          text-align: center;
          opacity: 0;
        }
        #s7-qr img {
          display: block;
          width: 372px;
          height: 372px;
        }
        #s7-qr span {
          display: block;
          margin-top: 12px;
          font-size: 30px;
          font-weight: 800;
          color: #0d1220;
          direction: ltr;
        }
        #s7-lock {
          position: absolute;
          right: 130px;
          bottom: 130px;
          direction: rtl;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 18px 34px;
          border-radius: 22px;
          border: 2px solid var(--glass-line);
          background: rgba(8, 11, 21, 0.85);
          opacity: 0;
        }
        #s7-lock b {
          font-size: 56px;
          font-weight: 900;
        }
        #s7-lock i {
          display: block;
          width: 5px;
          height: 60px;
          border-radius: 3px;
          background: var(--mint);
        }
        #s7-lock span {
          font-size: 36px;
          font-weight: 500;
          color: var(--brand-1);
        }
        #s7-lock small {
          margin-right: 12px;
          font-size: 18px;
          font-weight: 700;
          letter-spacing: 4px;
          color: var(--muted);
          direction: ltr;
        }
      </style>

      <div id="s7-root" data-composition-id="s7-cta" data-width="1920" data-height="1080" data-duration="12.1">
        <div id="s7-wrap">
          <div id="s7-cam">
            <video id="s7-video" class="clip" src="assets/clips/home-ring-clean.mp4" data-start="0" data-duration="12.1" data-playback-rate="0.8" data-track-index="0" muted playsinline></video>
          </div>
          <div id="s7-shade"></div>

          <div id="s7-qr">
            <img src="assets/telegram-qr.svg" alt="" />
            <span>AI_Community</span>
          </div>

          <div id="s7-copy">
            <div id="s7-eyebrow"><i></i><span>دعوت</span></div>
            <div id="s7-title">
              <span class="s7-w">به</span>
              <span class="s7-w">کامیونیتی</span>
              <span class="s7-w g">هوش</span>
              <span class="s7-w g">مصنوعی</span>
              <span class="s7-w">بپیوند</span>
            </div>
            <div id="s7-sub">کد را اسکن کن یا از این لینک وارد شو:</div>
            <div id="s7-link">
              <span class="s7-plane"
                ><svg width="36" height="36" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.1.9.8.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8l3.2-15.2c.3-1.3-.5-1.9-1.4-1.6Z" /></svg
              ></span>
              <span>t.me/+Orw2hE3tq3thMzNk</span>
            </div>
          </div>

          <div id="s7-lock">
            <b>فاطمه شمس</b>
            <i></i>
            <span>توسعه‌دهنده و مربی هوش مصنوعی</span>
            <small>THE INTELLIGENCE SPACE</small>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#s7-wrap", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
          tl.fromTo("#s7-cam", { scale: 1.0, filter: "blur(0px)" }, { scale: 1.1, filter: "blur(2px)", duration: 12.1, ease: "sine.inOut" }, 0);

          tl.fromTo("#s7-eyebrow", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.6);
          let t = 0.9;
          gsap.utils.toArray("#s7-root .s7-w").forEach(function (w, i) {
            const heavy = i === 4;
            tl.set(w, { opacity: 1, y: heavy ? 90 : 50 }, t);
            tl.to(w, { y: 0, duration: heavy ? 0.22 : 0.16, ease: "power4.out" }, t);
            t += heavy ? 0.24 : 0.15;
          });
          tl.fromTo("#s7-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.4);
          tl.fromTo("#s7-link", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(2)" }, 2.8);
          tl.fromTo("#s7-link .s7-plane", { rotation: -40, x: -30 }, { rotation: 0, x: 0, duration: 0.6, ease: "back.out(2.4)" }, 2.9);

          tl.fromTo("#s7-qr", { opacity: 0, scale: 0.5, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, 3.0);
          tl.fromTo(
            "#s7-qr",
            { boxShadow: "0 0 0 3px rgba(137, 255, 240, 0.6), 0 40px 120px rgba(0, 0, 0, 0.6)" },
            { boxShadow: "0 0 0 3px rgba(137, 255, 240, 1), 0 0 140px rgba(137, 255, 240, 0.5)", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false },
            4.0,
          );
          tl.fromTo("#s7-lock", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 4.8);
          tl.fromTo("#s7-lock i", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, 5.0);

          tl.to("#s7-wrap", { opacity: 0, duration: 1.0, ease: "power1.inOut" }, 11.1);

          window.__timelines["s7-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
